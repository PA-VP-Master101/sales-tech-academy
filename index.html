<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sales Tech Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Formation gratuite en 40 séances pour devenir SDR ou BDR dans la tech.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : site d'apprentissage. Bandeau « nuit » (en-tête + têtes de page) façon salle d'appels, contenu clair en dessous.
   Le corail est la couleur de l'action (appeler, commencer), chaque module garde sa couleur, l'or est réservé à l'XP. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#0E1626; --muted:#5A6579; --line:#E1E5EE;
  --brand:#E04E26; --on-brand:#FFFFFF;
  --night:#0A1222; --night-2:#121D35; --night-line:rgba(255,255,255,.09); --on-night:#EEF2FA; --on-night-muted:#9AA7C0; --hot:#FF7A4D; --teal:#2CC9B5;
  --flame:#FF6A1A; --flame-2:#FFB020; --xp:#C98A00; --ok:#12925C;
  --m1:#3F5BD8; --m2:#0E8F81; --m3:#2B7BDD; --m4:#CF3A84; --m5:#7A4ECF; --m6:#1C9655; --m7:#BF720A; --m8:#D6453A;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 8px 24px rgba(14,22,38,.06);
  --shadow-lg:0 24px 60px rgba(6,12,26,.28);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px; --on-c:#FFFFFF; --maxw:1180px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070C17; --surface:#0F1728; --surface-2:#131D31; --ink:#E8EDF6; --muted:#97A3B9; --line:#222D43;
  --brand:#FF7A4D; --on-brand:#0A1222; --night:#050912; --night-2:#0D1528;
  --flame:#FF8440; --flame-2:#FFC24D; --xp:#F2B437; --ok:#45CC8B;
  --m1:#8C9CFF; --m2:#37C6B3; --m3:#6AAEFF; --m4:#FF77B6; --m5:#B18DFF; --m6:#4FD08A; --m7:#F3B04A; --m8:#FF7C70;
  --shadow:0 1px 2px rgba(0,0,0,.35); --on-c:#0A1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C17; --surface:#0F1728; --surface-2:#131D31; --ink:#E8EDF6; --muted:#97A3B9; --line:#222D43;
  --brand:#FF7A4D; --on-brand:#0A1222; --night:#050912; --night-2:#0D1528;
  --flame:#FF8440; --flame-2:#FFC24D; --xp:#F2B437; --ok:#45CC8B;
  --m1:#8C9CFF; --m2:#37C6B3; --m3:#6AAEFF; --m4:#FF77B6; --m5:#B18DFF; --m6:#4FD08A; --m7:#F3B04A; --m8:#FF7C70;
  --shadow:0 1px 2px rgba(0,0,0,.35); --on-c:#0A1222; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--night)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
p{margin:0}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:var(--maxw);margin:0 auto;width:100%}

/* ---------- En-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--night) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--night-line);color:var(--on-night)}
.top .inner{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--hot);color:#0A1222;position:relative;overflow:hidden}
.logo-mark svg{width:20px;height:20px;stroke:#0A1222;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-size:11px;color:var(--on-night-muted);letter-spacing:.02em;margin-top:3px}
.nav{display:flex;align-items:center;gap:2px;margin-left:8px}
.ni{position:relative}
.nl{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:var(--on-night-muted);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.nl:hover,.ni.open>.nl,.nav:not(.quiet) .ni:hover>.nl{color:var(--on-night);background:rgba(255,255,255,.06)}
.nl[aria-current="page"]{color:var(--on-night)}
.nl[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-12px;height:2px;border-radius:2px;background:var(--hot)}
.nl .chev{width:14px;height:14px;transition:transform .2s}
.ni.open .chev,.nav:not(.quiet) .ni:hover .chev{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:-8px;padding-top:12px;display:none;z-index:70}
.ni.open .dd,.nav:not(.quiet) .ni:hover .dd{display:block;animation:ddin .18s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}}
.ddp{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:10px;min-width:300px}
.dd-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 6px}
.dd-l{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;text-decoration:none;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.dd-l:hover{background:var(--surface-2)}
.dd-l .di{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--brand)) 13%,var(--surface));color:var(--c,var(--brand))}
.dd-l .di .ico{width:18px;height:18px}
.dd-l .dn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--c);color:var(--on-c);font-family:var(--display);font-weight:800;font-size:14px}
.dd-l b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.dd-l small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.mega{left:-120px}
.mega .ddp{width:min(760px,calc(100vw - 40px));display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:14px}
.mega .foot-l{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding:12px 12px 4px;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.mega .foot-l a{color:var(--brand);font-weight:600;text-decoration:none}
.today-card{display:grid;gap:4px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));text-decoration:none;margin-top:6px}
.today-card b{font-family:var(--display);font-size:15px}
.today-card span{font-size:12.5px;color:var(--muted)}
.mprog{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center;white-space:nowrap}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
#pills{flex-wrap:nowrap}
.kbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--night-line);background:rgba(255,255,255,.04);color:var(--on-night-muted);cursor:pointer;font-size:13.5px}
.kbtn:hover{color:var(--on-night);background:rgba(255,255,255,.08)}
.kbtn kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--on-night-muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
.pill svg{width:16px;height:16px}
.pill.fl{background:rgba(255,122,77,.14);color:var(--hot)}
.pill.fl.off{background:rgba(255,255,255,.05);color:var(--on-night-muted)}
.pill.fl svg .o{fill:currentColor}.pill.fl svg .i{fill:var(--night)}
.pill.xp{background:rgba(242,180,55,.14);color:#F2B437}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:linear-gradient(140deg,var(--hot),#F2B437);color:#0A1222;font-family:var(--display);font-weight:800;font-size:15px;cursor:pointer;display:grid;place-items:center}
.prof .dd{left:auto;right:0}
.prof .ddp{width:300px;display:grid;gap:12px;padding:16px}
.lvl{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.lvl b{font-family:var(--display);font-size:15px}
.lvl small{font-size:12px;color:var(--muted)}
.burger{display:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--night-line);background:rgba(255,255,255,.04);color:var(--on-night);cursor:pointer;place-items:center}

/* Tiroir mobile */
.drawer{position:fixed;inset:0;z-index:90;display:flex;justify-content:flex-end;background:rgba(5,9,18,.55);animation:fade .2s ease}
.drawer-p{width:min(380px,100%);height:100%;overflow-y:auto;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:grid;align-content:start;gap:6px;animation:slidein .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 4px;font-weight:700;font-family:var(--display);font-size:17px;cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer details[open] summary .chev{transform:rotate(180deg)}
.drawer summary .chev{transition:transform .2s;width:18px;height:18px}
.drawer details>div{display:grid;gap:2px;padding-bottom:10px}
.drawer .solo{display:block;padding:14px 4px;font-weight:700;font-family:var(--display);font-size:17px;text-decoration:none;border-bottom:1px solid var(--line)}

/* ---------- Bandeaux de page ---------- */
.band{background:var(--night);color:var(--on-night);position:relative;overflow:hidden;isolation:isolate}
.band::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(600px 300px at 85% -10%,color-mix(in srgb,var(--c,var(--hot)) 30%,transparent),transparent 70%),
  radial-gradient(500px 260px at 5% 120%,rgba(44,201,181,.16),transparent 70%)}
.band::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background-image:linear-gradient(var(--night-line) 1px,transparent 1px),linear-gradient(90deg,var(--night-line) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.band .inner{padding-block:44px 48px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.band .eyebrow{color:var(--hot)}
.band h1{font-size:clamp(30px,4.6vw,48px);line-height:1.05;font-weight:800}
.band .lede{color:var(--on-night-muted);max-width:64ch;font-size:16.5px}
.crumbs{font-size:13px;color:var(--on-night-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--on-night-muted);text-decoration:none}
.crumbs a:hover{color:var(--on-night)}
.band .chip{background:rgba(255,255,255,.07);border-color:var(--night-line);color:var(--on-night-muted)}
.band .chip.cert{background:rgba(242,180,55,.14);color:#F2B437}
.band .mchip{background:rgba(255,255,255,.08)}
.wrap{padding-block:34px 70px}
.wrap>.inner{display:grid;gap:28px}

/* ---------- Composants ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:0;background:var(--c,var(--brand));color:var(--on-brand);text-decoration:none;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.hot{background:var(--hot);color:#0A1222;box-shadow:0 10px 30px rgba(255,122,77,.3)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--on-night);border:1px solid var(--night-line)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn .ico{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:600;text-decoration:none}
.chip.cert{background:color-mix(in srgb,var(--xp) 14%,var(--surface));border-color:transparent;color:var(--xp)}
.chip svg{width:13px;height:13px}
.mchip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--c)}
.mchip b{width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:11.5px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.input{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.input:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);outline-offset:0}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--brand)) 14%,var(--surface-2));overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.xpb i{background:linear-gradient(90deg,var(--xp),var(--flame-2))}
.ring .tr{stroke:color-mix(in srgb,var(--c,var(--brand)) 15%,var(--surface-2))}
.ring .pr{stroke:var(--c,var(--brand));transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap>span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
.chead h3{font-size:19px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sech h2{font-size:clamp(22px,2.6vw,28px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.note .ico{color:var(--brand);margin-top:2px}
.pm{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-c);flex:none;font-family:var(--display)}

/* ---------- Accueil : visiteur ---------- */
.hero .inner{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:40px;padding-block:64px 72px}
.hero h1{font-size:clamp(36px,5.6vw,64px);line-height:1.0;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--hot)}
.hero .lede{font-size:18px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.trust{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--on-night-muted)}
.trust span{display:inline-flex;gap:7px;align-items:center}
.trust .ico{width:16px;height:16px;color:var(--teal)}
.call{background:linear-gradient(180deg,var(--night-2),color-mix(in srgb,var(--night-2) 70%,var(--night)));border:1px solid var(--night-line);border-radius:24px;padding:22px;display:grid;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-width:440px;justify-self:end;width:100%}
.call-top{display:flex;align-items:center;gap:12px}
.call-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--teal),#3F5BD8);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#0A1222}
.call-top b{display:block;font-size:15px}
.call-top small{color:var(--on-night-muted);font-size:12.5px}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;color:var(--hot)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.wave{display:flex;align-items:center;gap:3px;height:38px}
.wave i{flex:1;border-radius:3px;background:linear-gradient(180deg,var(--hot),color-mix(in srgb,var(--hot) 40%,transparent));height:20%;animation:wv 1.2s ease-in-out infinite}
@keyframes wv{50%{height:var(--h)}}
.script{display:grid;gap:10px}
.line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:14px;color:var(--on-night)}
.line .ts{font-family:var(--mono);font-size:12px;color:var(--on-night-muted);padding-top:2px}
.line.you p{background:rgba(255,122,77,.12);border:1px solid rgba(255,122,77,.25);padding:9px 12px;border-radius:12px 12px 12px 4px}
.line.them p{background:rgba(255,255,255,.05);border:1px solid var(--night-line);padding:9px 12px;border-radius:12px 12px 12px 4px;color:var(--on-night-muted)}
.call-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--on-night-muted);padding-top:12px;border-top:1px solid var(--night-line)}
.call-foot b{color:var(--teal);font-family:var(--mono)}
.figs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.fig{padding:20px 18px;display:grid;gap:2px;border-right:1px solid var(--line)}
.fig:last-child{border-right:0}
.fig b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;letter-spacing:-.03em}
.fig span{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{display:grid;gap:10px;align-content:start}
.step .sn{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand)}
.step h3{font-size:19px}
.step p{color:var(--muted);font-size:14.5px}
.modgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.modcard{display:grid;gap:10px;align-content:start;text-decoration:none;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.modcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.modcard .mn{display:flex;justify-content:space-between;align-items:center}
.modcard .mn span:first-child{width:40px;height:40px;border-radius:12px;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.modcard h3{font-size:17px;line-height:1.2}
.modcard p{font-size:13.5px;color:var(--muted)}
.modcard .wk{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cta-band{border-radius:24px;padding:36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.cta-band h2{font-size:clamp(24px,3vw,34px)}

/* ---------- Accueil : tableau de bord ---------- */
.dash .inner{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:stretch;padding-block:36px 40px}
.dash .hello{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.dash .hello h1{font-size:clamp(30px,4.4vw,46px)}
.dash .hello p{color:var(--on-night-muted)}
.cont{background:var(--surface);color:var(--ink);border-radius:22px;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;position:relative;overflow:hidden;border:1px solid transparent}
.cont::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.cont h2{font-size:clamp(22px,2.6vw,30px);line-height:1.12;margin-top:12px}
.cont p.o{margin:8px 0 16px;color:var(--muted);max-width:52ch}
.cont .mchip{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.minipath{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.minipath a{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;text-decoration:none;border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));color:var(--c);background:var(--surface)}
.minipath a.d{background:var(--c);border-color:var(--c);color:var(--on-c)}
.minipath a.cur{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.streakc{background:rgba(255,255,255,.04);border:1px solid var(--night-line);border-radius:22px;padding:22px;display:grid;gap:14px;align-content:start}
.streak-top{display:flex;align-items:center;gap:14px}
.bigflame{width:58px;height:58px;flex:none}
.bigflame .o{fill:rgba(255,255,255,.12)} .bigflame .i{fill:var(--night)}
.lit .bigflame .o{fill:url(#flameGrad)} .lit .bigflame .i{fill:#FFE3B0}
.lit .bigflame{animation:flick 2.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04) rotate(-1.5deg)}60%{transform:scale(.98) rotate(1.2deg)}}
.sn-big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}
.lit .sn-big{color:var(--hot)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:grid;justify-items:center;gap:5px;font-size:11px;color:var(--on-night-muted);font-weight:700}
.wd b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--night-line)}
.wd b svg{width:17px;height:17px}
.wd b svg .o{fill:rgba(255,255,255,.14)} .wd b svg .i{fill:var(--night)}
.wd.on b{background:rgba(255,122,77,.16);border-color:rgba(255,122,77,.4)}
.wd.on b svg .o{fill:var(--hot)} .wd.on b svg .i{fill:#FFE3B0}
.wd.now{color:var(--on-night)}
.wd.now b{box-shadow:0 0 0 2px var(--night),0 0 0 3.5px var(--on-night)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;gap:14px;align-items:center;padding:18px;text-decoration:none}
.stat .t{display:grid;gap:1px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:21px;font-weight:800;line-height:1.15}
.stat .s{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.glance{display:grid;gap:7px}
.grow{display:grid;grid-template-columns:36px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.grow .lab{font-size:11.5px;font-weight:800;color:var(--c);font-family:var(--mono)}
.tile{height:32px;border-radius:9px;border:1.5px solid color-mix(in srgb,var(--c) 26%,var(--line));background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;transition:transform .12s;font-family:var(--mono)}
.tile:hover{transform:translateY(-1px)}
.tile.part{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,var(--surface)) var(--p),var(--surface-2) var(--p));border-color:color-mix(in srgb,var(--c) 45%,var(--line));color:var(--ink)}
.tile.d{background:var(--c);border-color:var(--c);color:var(--on-c)}
.tile.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cell{height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.pad{visibility:hidden}
.cell .p{font-size:9.5px;font-weight:800;color:var(--brand);line-height:1;font-family:var(--mono)}
.cell.plan{background:var(--surface-2)}
.cell.act{background:linear-gradient(160deg,var(--flame-2),var(--flame));color:#fff;font-weight:700}
.cell.act .p{color:#fff}
.cell.now{box-shadow:inset 0 0 0 2px var(--ink)}
.startset{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.badges{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.badge{display:grid;justify-items:center;gap:7px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:var(--muted);background:var(--surface-2);border:2px dashed var(--line)}
.badge.got .medal{color:var(--on-c);border:0;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.badge.got{color:var(--ink)}

/* ---------- Parcours ---------- */
.part-t{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.part-t h2{font-size:26px}
.mod{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:90px}
.mod>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:20px 22px;background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.mod>summary::-webkit-details-marker{display:none}
.mod>summary:hover{background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.modnum{width:54px;height:54px;border-radius:16px;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px}
.mod h2{font-size:21px}
.mod summary p{color:var(--muted);font-size:14px;margin-top:3px}
.mod .chev{width:22px;height:22px;transition:transform .25s;color:var(--muted)}
.mod[open] .chev{transform:rotate(180deg)}
.mod-body{padding:8px 22px 22px;display:grid;gap:14px}
.livdl{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 4px}
.livdl div{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.livdl dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:800;margin-bottom:4px}
.livdl dd{margin:0}
.track{list-style:none;margin:0;padding:0;display:grid;gap:8px;position:relative}
.track::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 20%,var(--line))}
.track a{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;padding:6px 0;border-radius:14px}
.track a:hover .tcard{border-color:color-mix(in srgb,var(--c) 40%,var(--line));transform:translateX(3px)}
.node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--surface);border:3px solid color-mix(in srgb,var(--c) 35%,var(--line));color:var(--c);z-index:1}
.node.d{background:var(--c);border-color:var(--c);color:var(--on-c)}
.node.cur{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 8%,transparent)}}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;transition:border-color .15s,transform .15s}
.tcard h3{font-size:15.5px;font-family:var(--body);font-weight:600;letter-spacing:0}
.tcard p{font-size:13.5px;color:var(--muted)}
.tcard .st{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tcard .st.d{color:var(--ok)}

/* ---------- Séance ---------- */
.sprog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;max-width:620px}
.sprog .bar{background:rgba(255,255,255,.1)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:16px;box-shadow:var(--shadow);transition:background .2s}
.task.is-done{background:var(--surface-2);box-shadow:none}
.task.is-done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.task.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{30%{transform:scale(1.015)}}
.chk{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--surface);cursor:pointer;margin:0;display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.chk:hover{transform:scale(1.06);border-color:var(--c)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.tbody{display:grid;gap:10px;min-width:0}
.tmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:3px 9px;border-radius:6px;background:color-mix(in srgb,var(--m1) 12%,var(--surface));color:var(--m1)}
.kind.p{background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:var(--ok)}
.tt{max-width:74ch;font-size:15px;cursor:pointer}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res li a,.res li div{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;min-width:0;transition:border-color .15s,background .15s}
.res li a:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:var(--surface)}
.res .pm{width:32px;height:32px;font-size:11px;border-radius:9px}
.res .rt{display:grid;min-width:0;flex:1}
.res .rt b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.res .rt span{font-size:12.5px;color:var(--muted)}
.res .rc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.jump{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;color:var(--c);cursor:pointer;text-decoration:none}
.jump .ico{width:16px;height:16px}
details.sol{font-size:14px;background:var(--surface-2);border-radius:12px;padding:11px 14px;border:1px solid var(--line)}
details.sol summary{cursor:pointer;font-weight:700;color:var(--c)}
details.sol p{margin-top:8px}
.livr{display:grid;gap:8px;padding:18px 20px;border-radius:var(--r);border:1px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Fiches ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fcard{display:grid;gap:10px;align-content:start;text-decoration:none;transition:transform .18s,border-color .18s}
.fcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.fcard .fn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c)}
.fcard h3{font-size:18px;line-height:1.2}
.fcard p{font-size:14px;color:var(--muted)}
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:start}
.prose{display:grid;gap:18px;font-size:16px;line-height:1.7;max-width:70ch}
.prose h2{font-size:24px;margin-top:10px}
.prose h3{font-size:18px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:grid;gap:6px}
.prose table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}
.prose th,.prose td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.prose th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prose .case{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:18px 20px;display:grid;gap:10px;font-size:15px}
.prose .ex{font-family:var(--mono);font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.6}
.keybox{position:sticky;top:96px;display:grid;gap:12px;border-top:4px solid var(--c)}
.keybox h3{font-size:16px}
.keybox ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.scroll{overflow-x:auto}

/* ---------- Certifications ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.ccard{display:grid;gap:12px;align-content:start;position:relative}
.ccard.done{border-color:color-mix(in srgb,var(--xp) 55%,var(--line))}
.ccard .top2{display:flex;gap:12px;align-items:flex-start}
.ccard .pm{width:44px;height:44px;border-radius:12px;font-size:14px}
.ccard h3{font-size:17px;line-height:1.25}
.ccard .org{font-size:13px;color:var(--muted)}
.ccard p.d{font-size:14px}
.ccard .acc{font-size:12.5px;color:var(--muted)}
.ccard .got{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--flame-2),var(--xp))}
.ccard .got svg{width:16px;height:16px;stroke:#fff}
.cstat{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.cstat button{flex:1;border:0;background:transparent;padding:7px 10px;white-space:nowrap;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.cstat button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cstat button[aria-pressed="true"][data-v="done"]{background:var(--ok);color:#fff}

/* ---------- Glossaire, cartes, quiz ---------- */
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gtools .input{flex:1 1 260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{padding:16px 18px;display:grid;gap:6px;align-content:start;box-shadow:none}
.gcard .term{font-family:var(--display);font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard .en{font-size:13px;color:var(--c);font-weight:700}
.gcard p{font-size:14px;color:var(--muted)}
.known{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);flex:none}
.known svg{width:13px;height:13px;stroke:#fff}
.fc-wrap{display:grid;gap:16px;justify-items:center}
.fc{width:min(580px,100%);height:310px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:grid;place-items:center;align-content:center;gap:12px;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-front{background:var(--surface)}
.fc-front .t{font-family:var(--display);font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.1}
.fc-front .h{font-size:13px;color:var(--muted)}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,var(--surface)),var(--surface))}
.fc-back .en{font-family:var(--display);font-size:21px;font-weight:700;color:var(--c)}
.fc-back p{font-size:15.5px;max-width:46ch}
.fc-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.quiz{max-width:680px;width:100%;margin:0 auto;display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-family:var(--mono)}
.qcard{display:grid;gap:16px;padding:26px}
.qcard .q{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.15}
.qcard .qk{font-size:13px;color:var(--muted);font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.opt .lt{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--mono);font-weight:700;font-size:13px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--m8);background:color-mix(in srgb,var(--m8) 9%,var(--surface))}
.opt.wrong .lt{background:var(--m8);color:#fff}
.opt[disabled]{cursor:default}

/* ---------- Ressources & outils ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;padding:16px;text-decoration:none;box-shadow:none;transition:border-color .15s,transform .15s}

.tool ol,.tool ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14.5px}
.tool .tpl{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;display:grid;gap:8px}

@keyframes flash{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:var(--shadow)}}

.foot{background:var(--night);color:var(--on-night-muted);font-size:13px}

.foot h4{color:var(--on-night);font-size:14px;margin-bottom:10px;font-family:var(--body);letter-spacing:0}
.foot a{color:var(--on-night-muted);text-decoration:none;display:block;padding:3px 0}

.sync{display:inline-flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--on-night-muted)}
.sync.db i{background:var(--teal)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:130;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toast 3.2s ease forwards;max-width:calc(100vw - 32px)}

.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px;background:rgba(5,9,18,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease}

{t:"Le métier de SDR et de BDR",sub:"Ce que fait un SDR, ce que font les rôles autour de lui, et ce qu'on attend de toi.",m:0,min:10,body:`
<p>Le SDR (Sales Development Representative) et le BDR (Business Development Representative) occupent la première marche de l'équipe commerciale. Leur mission tient en une phrase : <b>créer des rendez-vous qualifiés pour les Account Executives</b>. Le SDR ne vend pas le produit. Il vend un rendez-vous de 30 minutes à quelqu'un qui ne l'attendait pas.</p>
<h2>SDR ou BDR ?</h2>
<p>Dans beaucoup d'entreprises, le SDR traite les demandes entrantes (inbound : formulaire, essai gratuit, webinar) et le BDR prospecte des comptes qui n'ont rien demandé (outbound). Dans d'autres, les deux titres désignent le même poste. Lis toujours la fiche de poste : c'est elle qui dit si tu feras surtout de l'entrant, du sortant, ou les deux.</p>
<h2>Les rôles autour de toi</h2>
<div class="scroll"><table><thead><tr><th>Rôle</th><th>Mission</th><th>Jugé sur</th></tr></thead><tbody>
<tr><td><b>SDR</b><br><span class="muted">Sales Development Rep.</span></td><td>Qualifier les leads entrants, planifier les rendez-vous</td><td>Rendez-vous qualifiés, SQL</td></tr>
<tr><td><b>BDR</b><br><span class="muted">Business Development Rep.</span></td><td>Prospecter des comptes cibles en sortant</td><td>Rendez-vous tenus, pipeline généré</td></tr>
<tr><td><b>AE</b><br><span class="muted">Account Executive</span></td><td>Mener l'affaire jusqu'à la signature</td><td>Chiffre d'affaires signé (quota)</td></tr>
<tr><td><b>AM</b><br><span class="muted">Account Manager</span></td><td>Faire grandir les clients existants</td><td>Renouvellements, upsell, NRR</td></tr>
<tr><td><b>CSM</b><br><span class="muted">Customer Success Manager</span></td><td>Faire adopter le produit</td><td>Churn, satisfaction, usage</td></tr>
<tr><td><b>Avant-vente</b><br><span class="muted">Sales Engineer</span></td><td>Démontrer le produit, répondre aux questions techniques</td><td>Taux de conclusion des affaires suivies</td></tr>
</tbody></table></div>
<h2>Ce que fait un SDR dans une semaine</h2>
<p>Les volumes varient beaucoup selon l'entreprise, le segment visé et la part d'inbound. Ce qui ne varie pas : du temps de recherche sur les comptes, des blocs d'appels, des emails et messages LinkedIn personnalisés, la mise à jour du CRM, et un point régulier avec le manager pour écouter des appels ensemble.</p>
<h2>Les qualités qu'un recruteur cherche</h2>
<ul><li><b>Résilience</b> : la plupart des prises de contact ne donnent rien, et c'est normal.</li><li><b>Curiosité</b> : comprendre un secteur et un interlocuteur en quelques minutes.</li><li><b>Écrit concis</b> : un email de 5 lignes qui donne envie de répondre.</li><li><b>Écoute</b> : poser une question, puis se taire.</li><li><b>Organisation</b> : suivre des dizaines de comptes sans en perdre un.</li><li><b>Coachabilité</b> : appliquer un retour dès l'appel suivant.</li></ul>`,
key:["Le SDR vend un rendez-vous, pas le produit.","SDR et BDR : entrant contre sortant, mais les titres se mélangent.","Chaque rôle a son indicateur : connais-les en français et en anglais.","Résilience et coachabilité pèsent autant que l'aisance à l'oral."]},
{t:"Les entreprises tech et le cycle de vente",sub:"Startups, scale-ups, éditeurs établis, et les étapes d'une vente B2B.",m:0,min:10,body:`
<h2>Où travaillent les SDR</h2>
<ul><li><b>Startup</b> (avant ou autour de la série A) : petite équipe, beaucoup d'autonomie, processus à construire. Tu apprends vite, avec moins d'encadrement.</li><li><b>Scale-up</b> (séries B à D) : équipe SDR structurée, manager dédié, outils en place, objectifs clairs. C'est souvent le meilleur endroit pour apprendre le métier.</li><li><b>Éditeur établi</b> (HubSpot, Salesforce, Microsoft…) : formation solide, processus rodés, marque connue qui ouvre des portes, mobilité interne.</li></ul>
<h2>Les segments de clients</h2>
<p>On découpe les clients par taille : <b>SMB</b> (petites entreprises), <b>Mid-Market</b> et <b>Enterprise</b> (grands comptes). Plus le client est gros, plus le contrat est important, plus il y a de décideurs, et plus le cycle de vente est long : quelques semaines en SMB, souvent six mois à un an en Enterprise.</p>
<h2>Les étapes d'une vente B2B</h2>
<div class="scroll"><table><thead><tr><th>#</th><th>Étape</th><th>Qui</th></tr></thead><tbody>
<tr><td>1</td><td>Ciblage des comptes et des contacts</td><td>SDR / BDR, marketing</td></tr>
<tr><td>2</td><td>Prise de contact : appels, emails, LinkedIn</td><td>SDR / BDR</td></tr>
<tr><td>3</td><td>Qualification et prise de rendez-vous</td><td>SDR / BDR</td></tr>
<tr><td>4</td><td>Découverte : comprendre les problèmes</td><td>AE</td></tr>
<tr><td>5</td><td>Démonstration, parfois preuve de concept</td><td>AE, avant-vente</td></tr>
<tr><td>6</td><td>Proposition et négociation</td><td>AE</td></tr>
<tr><td>7</td><td>Signature</td><td>AE</td></tr>
<tr><td>8</td><td>Mise en route, adoption, renouvellement</td><td>CSM, Account Manager</td></tr>
</tbody></table></div>
<h2>L'entonnoir, en chiffres</h2>
<p>Un exemple pour visualiser l'ordre de grandeur (chaque entreprise a ses propres taux) :</p>
<p class="ex">1 000 contacts ciblés → 120 conversations → 30 rendez-vous → 20 qualifiés par l'AE → 5 contrats signés</p>
<p>Ton travail se joue sur les trois premières flèches. Améliorer d'un point ton taux de conversation en rendez-vous change le chiffre d'affaires de toute l'équipe.</p>`,
key:["La scale-up est souvent le meilleur terrain pour apprendre.","Plus le client est gros, plus le cycle est long et les décideurs nombreux.","Le SDR possède les étapes 1 à 3 du cycle.","Connais les taux de ton entonnoir : c'est ton tableau de bord."]},
{t:"Cibler des situations, pas des fiches",sub:"ICP, signal d'achat, bon interlocuteur, et la cadence de Léa sur 10 jours.",m:1,min:12,body:`
<p>Une liste de 500 entreprises du bon secteur ne fait pas une prospection. Ce qui fait répondre un prospect, c'est que tu le contactes <b>au moment où il a probablement le problème</b>. On contacte des situations, pas des fiches.</p>
<h2>La formule d'un bon compte</h2>
<p class="ex">Bon compte = correspond à l'ICP + un signal récent + le bon interlocuteur</p>
<ul><li><b>ICP</b> : secteur, taille, pays, outils utilisés, modèle économique.</li><li><b>Signal</b> : levée de fonds, vague de recrutement, nouveau dirigeant, ouverture d'un pays, changement d'outil, résultats publiés, déménagement.</li><li><b>Interlocuteur</b> : la personne qui vit le problème au quotidien, ou celle qui en répond devant la direction.</li></ul>
<h2>Exemple</h2>
<div class="case"><p><b>Produit</b> : un logiciel d'onboarding des nouveaux salariés.</p><p><b>Signal</b> : une scale-up de 180 personnes publie 25 offres d'emploi en un mois.</p><p><b>Interlocuteur</b> : la responsable RH, qui va devoir accueillir 25 personnes avec un processus pensé pour 3.</p><p><b>Accroche</b> : « J'ai vu que vous recrutiez 25 personnes ce trimestre. Comment gérez-vous l'arrivée d'autant de nouveaux en même temps ? »</p></div>
<h2>La cadence de Léa sur 10 jours</h2>
<p>Léa est SDR chez un éditeur SaaS RH. Voici la séquence qu'elle utilise pour une responsable RH repérée grâce à un signal. Chaque touche apporte un angle nouveau, jamais un simple « je me permets de relancer ».</p>
<div class="scroll"><table><thead><tr><th>Jour</th><th>Canal</th><th>Contenu</th></tr></thead><tbody>
<tr><td class="mono">J1</td><td>Email</td><td>Le signal, une question sur le problème probable, une demande simple</td></tr>
<tr><td class="mono">J1</td><td>LinkedIn</td><td>Visite du profil, puis demande de connexion sans message commercial</td></tr>
<tr><td class="mono">J2</td><td>Appel</td><td>Ouverture en 30 secondes, raison de l'appel, question</td></tr>
<tr><td class="mono">J4</td><td>Email</td><td>Nouvel angle : ce que vivent des entreprises comparables</td></tr>
<tr><td class="mono">J6</td><td>Appel + vocal</td><td>Deuxième essai, message vocal de 20 secondes qui renvoie à l'email</td></tr>
<tr><td class="mono">J7</td><td>LinkedIn</td><td>Message court si la connexion est acceptée</td></tr>
<tr><td class="mono">J9</td><td>Appel</td><td>Troisième essai, à un autre moment de la journée</td></tr>
<tr><td class="mono">J10</td><td>Email</td><td>Email de clôture : « Je ne vous relancerai plus, dites-moi si le sujet revient »</td></tr>
</tbody></table></div>
<p>Pour l'exercice du module 3, tu construis une version à 6 touches : garde le premier email, deux appels, une touche LinkedIn, un email avec un nouvel angle et l'email de clôture.</p>`,
key:["On contacte une situation : ICP + signal + interlocuteur.","Un signal se date et se source.","Chaque relance apporte un nouvel angle.","Mélange les canaux : email, appel, LinkedIn."]},
{t:"La découverte et la méthode SPIN",sub:"Faire parler le prospect de ses problèmes, et le cas Eddie pour t'entraîner.",m:4,min:12,body:`
<p>Le rendez-vous de découverte (discovery call) sert à comprendre la situation du prospect avant de parler du produit. Une bonne découverte, c'est le prospect qui parle environ deux tiers du temps. Tu poses des questions, tu reformules, tu creuses.</p>
<h2>Les quatre temps de SPIN</h2>
<div class="scroll"><table><thead><tr><th>Temps</th><th>But</th><th>Exemple</th></tr></thead><tbody>
<tr><td><b>Situation</b></td><td>Comprendre le contexte (peu de questions, tu as fait tes recherches)</td><td>« Combien de factures fournisseurs traitez-vous par mois ? »</td></tr>
<tr><td><b>Problème</b></td><td>Faire émerger une difficulté</td><td>« Qu'est-ce qui ralentit votre clôture mensuelle ? »</td></tr>
<tr><td><b>Implication</b></td><td>Mesurer ce que coûte le problème</td><td>« Que se passe-t-il quand la clôture prend 12 jours au lieu de 5 ? »</td></tr>
<tr><td><b>Need-payoff</b></td><td>Faire dire au prospect ce que la solution changerait</td><td>« Si vos équipes ne ressaisissaient plus les factures, à quoi passeraient-elles ce temps ? »</td></tr>
</tbody></table></div>
<h2>Trois règles</h2>
<ul><li>Une question à la fois, puis silence.</li><li>Reformule avant de passer à la suite : « Si je comprends bien… ».</li><li>Termine toujours par une prochaine étape datée.</li></ul>
<h2>Le cas Eddie</h2>
<div class="case"><p><b>Eddie Martin</b> est directeur administratif et financier de LogiTrans, un transporteur lyonnais de 350 salariés. Tu l'as eu au téléphone après avoir vu que LogiTrans ouvrait deux agences en Espagne.</p><p>Ses équipes traitent environ 4 000 factures fournisseurs par mois et les ressaisissent à la main dans l'ERP, changé l'an dernier. La clôture mensuelle prend 12 jours ; la directrice générale, Claire Dubois, veut 5 jours d'ici l'été pour présenter les chiffres plus vite aux banques.</p><p>Inès, la responsable comptable, a testé l'outil d'un concurrent l'an dernier et en parle positivement à Eddie. L'expert-comptable du groupe recommande une autre solution. Les budgets outils de l'année suivante sont validés par Claire Dubois en octobre. La DSI doit valider la sécurité de tout nouvel outil, ce qui prend en général six semaines.</p><p>Eddie te dit : « Si on peut gagner une semaine sur la clôture, ça m'intéresse. Mais je ne signe rien seul. »</p></div>
<p>Exercice : écris 3 questions SPIN de chaque type pour Eddie, puis remplis la grille MEDDIC de la fiche 5 à partir de ce cas.</p>`,
key:["La découverte sert à comprendre, pas à présenter.","Le prospect parle deux tiers du temps.","L'implication donne sa valeur au problème.","Toujours finir sur une prochaine étape datée."]},
{t:"MEDDIC et les ventes complexes",sub:"Six questions pour savoir si une grande affaire peut vraiment se signer.",m:4,min:10,body:`
<p>BANT suffit pour une petite vente. Quand plusieurs personnes décident, que le contrat est important et que le cycle dure des mois, les équipes utilisent <b>MEDDIC</b>. En tant que SDR, tu ne rempliras pas toute la grille, mais tu dois en connaître les cases : c'est ce que l'AE cherchera à compléter après ta passation.</p>
<div class="scroll"><table><thead><tr><th>Lettre</th><th>Question</th></tr></thead><tbody>
<tr><td><b>M</b> · Metrics</td><td>Quel gain chiffré le client attend-il ?</td></tr>
<tr><td><b>E</b> · Economic buyer</td><td>Qui contrôle le budget et signe ?</td></tr>
<tr><td><b>D</b> · Decision criteria</td><td>Sur quels critères la solution sera-t-elle choisie ?</td></tr>
<tr><td><b>D</b> · Decision process</td><td>Quelles étapes, quelles personnes, quel calendrier jusqu'à la signature ?</td></tr>
<tr><td><b>I</b> · Identify pain</td><td>Quel problème concret, et que coûte-t-il ?</td></tr>
<tr><td><b>C</b> · Champion</td><td>Qui défend le projet en interne quand tu n'es pas là ?</td></tr>
</tbody></table></div>
<p><b>MEDDPICC</b> ajoute deux cases : le <b>P</b>aper process (contrat, juridique, achats) et la <b>C</b>oncurrence.</p>
<h2>Corrigé du cas Eddie</h2>
<details class="sol"><summary>Afficher la grille MEDDIC remplie</summary>
<div class="scroll"><table><tbody>
<tr><td><b>Metrics</b></td><td>Passer la clôture de 12 à 5 jours ; 4 000 factures par mois ressaisies à la main.</td></tr>
<tr><td><b>Economic buyer</b></td><td>Claire Dubois, directrice générale : elle valide les budgets outils en octobre. Eddie l'a dit : « je ne signe rien seul ».</td></tr>
<tr><td><b>Decision criteria</b></td><td>Gain de temps sur la clôture, compatibilité avec le nouvel ERP, sécurité validée par la DSI. À confirmer : le prix et le support en espagnol pour les nouvelles agences.</td></tr>
<tr><td><b>Decision process</b></td><td>Eddie évalue, la DSI valide la sécurité (6 semaines), Claire Dubois arbitre en octobre. Pour une mise en place avant l'été, il faut commencer la validation DSI très tôt.</td></tr>
<tr><td><b>Identify pain</b></td><td>Ressaisie manuelle, clôture trop lente, pression des banques et de la DG, croissance en Espagne qui va ajouter du volume.</td></tr>
<tr><td><b>Champion</b></td><td>Eddie est un champion possible. Inès est un risque : elle préfère l'outil concurrent. L'expert-comptable pousse une troisième solution.</td></tr>
<tr><td><b>Concurrence</b></td><td>L'outil testé par Inès et celui recommandé par l'expert-comptable.</td></tr>
</tbody></table></div></details>
<p>Ta note de passation à l'AE reprend ces éléments en cinq lignes : contexte, problème chiffré, qui décide, risques, prochaine étape datée.</p>`,
key:["MEDDIC sert aux ventes à plusieurs décideurs.","Le champion et l'acheteur économique sont rarement la même personne.","Le processus de décision fixe le vrai calendrier.","Ta passation donne à l'AE les premières cases remplies."]},
{t:"Traiter les objections",sub:"Reconnaître, poser une question, rebondir. Jamais d'argumentation frontale.",m:3,min:10,body:`
<p>Une objection en début d'appel n'est presque jamais un vrai refus. C'est un réflexe : le prospect ne t'attendait pas et cherche à raccrocher poliment. Si tu argumentes, tu confirmes qu'il avait raison de se méfier. Si tu poses une question, tu ouvres une conversation.</p>
<h2>La règle en trois temps</h2>
<ol><li><b>Reconnaître</b> : « Je comprends, vous ne m'attendiez pas. »</li><li><b>Poser une question</b> : une seule, courte, sur sa situation.</li><li><b>Rebondir</b> : relier sa réponse à la raison de ton appel, puis proposer un créneau.</li></ol>
<h2>Six objections et une réponse type</h2>
<div class="scroll"><table><thead><tr><th>Objection</th><th>Réponse possible</th></tr></thead><tbody>
<tr><td>« Envoyez-moi un email. »</td><td>« Avec plaisir. Pour qu'il vous soit utile, comment gérez-vous [sujet] aujourd'hui ? »</td></tr>
<tr><td>« Je n'ai pas le temps. »</td><td>« Je comprends. Je vous prends 30 secondes pour la raison de mon appel, et vous me dites si ça vaut un autre créneau ? »</td></tr>
<tr><td>« On a déjà un outil. »</td><td>« Très bien. Qu'est-ce qui vous plaît le plus dedans, et qu'est-ce que vous changeriez ? »</td></tr>
<tr><td>« Pas de budget. »</td><td>« C'est logique si le sujet n'est pas prioritaire. À quel moment préparez-vous les budgets de l'an prochain ? »</td></tr>
<tr><td>« Ça ne m'intéresse pas. »</td><td>« D'accord. Par curiosité, est-ce que [problème courant] se pose chez vous, ou pas du tout ? »</td></tr>
<tr><td>« Rappelez-moi dans 6 mois. »</td><td>« Avec plaisir. Qu'est-ce qui aura changé d'ici là ? »</td></tr>
</tbody></table></div>
<h2>Ce qu'il faut éviter</h2>
<ul><li>Contredire : « Justement, notre outil est bien meilleur… »</li><li>Enchaîner trois arguments sans respirer.</li><li>Lâcher dès la première objection : propose au moins une question avant de conclure.</li><li>Insister après deux refus clairs : remercie et note la date de relance dans le CRM.</li></ul>`,
key:["Une objection d'ouverture est un réflexe, pas un refus.","Reconnaître, questionner, rebondir.","Une seule question, puis silence.","Deux refus clairs : remercie et planifie une relance."]},
{t:"Journée type, rémunération, carrière",sub:"Le quotidien d'un SDR, comment il est payé et où le métier mène.",m:0,min:10,body:`
<h2>Une journée type</h2>
<div class="scroll"><table><thead><tr><th>Heure</th><th>Activité</th></tr></thead><tbody>
<tr><td class="mono">8 h 45</td><td>Recherche de comptes et préparation des appels du matin</td></tr>
<tr><td class="mono">9 h 30</td><td>Premier bloc d'appels, sans interruption</td></tr>
<tr><td class="mono">11 h 30</td><td>Emails et messages LinkedIn personnalisés</td></tr>
<tr><td class="mono">14 h</td><td>Suivi des séquences, mise à jour du CRM, préparation des passations</td></tr>
<tr><td class="mono">15 h 30</td><td>Second bloc d'appels</td></tr>
<tr><td class="mono">17 h 30</td><td>Bilan du jour, liste du lendemain</td></tr>
</tbody></table></div>
<p>Dans la semaine s'ajoutent un point avec le manager (souvent avec l'écoute d'appels enregistrés), un point d'équipe et des formations produit.</p>
<h2>La rémunération</h2>
<p>Un SDR est payé avec un <b>fixe</b> et un <b>variable</b>. Le total visé si tu atteins 100 % de ton objectif s'appelle l'<b>OTE</b> (On-Target Earnings). Le partage est souvent autour de 70 % de fixe et 30 % de variable, avec des variations selon l'entreprise.</p>
<ul><li>Le variable dépend en général des rendez-vous qualifiés et tenus, parfois du pipeline généré ou des affaires signées.</li><li>Des <b>accélérateurs</b> augmentent le variable au-delà de 100 % de l'objectif.</li><li>Les premiers mois (<b>ramp-up</b>) ont un objectif réduit, parfois un variable garanti.</li></ul>
<p>Pour les montants actuels en France, appuie-toi sur les articles de Skipcall et de Licorne Society listés dans les ressources : ils publient des fourchettes mises à jour par ville et par niveau.</p>
<h2>Où mène le métier</h2>
<p>La voie classique : SDR pendant 12 à 24 mois, puis <b>AE</b> en SMB, puis Mid-Market et Enterprise. D'autres voies existent : manager SDR, Account Manager, Customer Success, partenariats, RevOps ou marketing.</p>
<h2>Les questions à poser en entretien</h2>
<ul><li>Quelle est la durée du ramp-up et l'objectif pendant cette période ?</li><li>Quelle part de l'équipe atteint son objectif ?</li><li>Comment se répartissent le fixe et le variable ?</li><li>Combien de temps faut-il en moyenne pour passer AE ?</li></ul>`,
key:["Les blocs d'appels se protègent dans l'agenda.","OTE = fixe + variable à 100 % de l'objectif.","Demande toujours la part de l'équipe qui atteint son objectif.","SDR 12 à 24 mois, puis AE : la voie la plus courante."]},
{t:"Raconter ton parcours",sub:"Transformer ton histoire en argument, même sans expérience en vente.",m:5,min:8,body:`
<p>Un recruteur SDR ne cherche pas un vendeur expérimenté. Il cherche quelqu'un qui apprend vite, encaisse les refus et a de bonnes raisons de vouloir ce métier. Ton récit doit le prouver en une minute.</p>
<h2>La structure en quatre temps</h2>
<ol><li><b>D'où tu viens</b> : ton parcours en une phrase.</li><li><b>Le déclic</b> : un moment concret qui t'a donné envie de la vente tech. Une conversation avec un SDR, un projet, un job.</li><li><b>Ce que ton parcours t'apporte</b> : relie tes compétences au métier.</li><li><b>Ta preuve</b> : ce que tu as déjà fait pour te préparer.</li></ol>
<h2>Relier ton parcours au métier</h2>
<div class="scroll"><table><thead><tr><th>Ton expérience</th><th>Ce qu'elle prouve pour un SDR</th></tr></thead><tbody>
<tr><td>Études de stratégie, de commerce ou d'ingénieur</td><td>Analyser un marché, segmenter, comprendre les enjeux d'un dirigeant : la base de l'ICP et de la découverte</td></tr>
<tr><td>Sport en compétition</td><td>Discipline, gestion de la défaite, goût des objectifs chiffrés</td></tr>
<tr><td>Job étudiant en vente ou en service client</td><td>Écoute, aisance avec des inconnus, gestion des clients mécontents</td></tr>
<tr><td>Association ou BDE</td><td>Prospection de partenaires et de sponsors, refus encaissés</td></tr>
<tr><td>Projet entrepreneurial</td><td>Initiative, autonomie, premiers clients démarchés</td></tr>
</tbody></table></div>
<h2>Ta preuve, grâce à cette formation</h2>
<p>160 heures de formation, des certifications HubSpot, LinkedIn et Salesforce, des dizaines d'appels simulés et notés, des séquences écrites en français et en anglais, et un dossier de ciblage sur une vraie entreprise. Peu de candidats juniors arrivent avec autant d'éléments concrets.</p>
<h2>La question à préparer</h2>
<p>« Pourquoi la vente plutôt que [ton autre option] ? » Réponds sans dénigrer l'autre voie : parle de ce qui t'attire dans la vente (le contact client, des résultats visibles chaque semaine, une progression rapide).</p>`,
key:["Le recruteur achète ta capacité à apprendre.","Un déclic concret vaut mieux qu'une passion vague.","Chaque expérience se traduit en compétence SDR.","Tes certifications et tes appels notés sont ta preuve."]},
];

 candidature:{t:"CV et message au manager SDR",i:"doc",d:"Une page, des résultats chiffrés, les mots-clés des offres.",html:`<div class="tpl"><p><b>Prénom Nom</b> · Ville · Téléphone · Email · LinkedIn</p><p><b>Sales Development Representative · SaaS B2B</b><br>Deux phrases : ton parcours, puis une preuve chiffrée de résultat ou de persévérance.</p><p><b>Expériences</b> · Poste · Entreprise · Dates<br>Une à trois lignes par expérience : verbe d'action, ce que tu as fait, résultat chiffré. Exemple : « Analysé 40 concurrents et présenté 3 recommandations au comité de direction, dont 2 retenues. »</p><p><b>Formation en développement commercial (2026)</b><br>Programme intensif de 160 heures : ciblage, séquences multicanales, appels à froid simulés et notés.</p><p><b>Certifications</b> · HubSpot Inbound Sales, HubSpot Sales Hub Software, LinkedIn Sales Navigator Essentials, badges Salesforce Trailhead</p><p><b>Formation</b> · [Diplôme], [École]<br><b>Outils</b> · HubSpot, Salesforce, LinkedIn Sales Navigator, lemlist, Apollo<br><b>Langues</b> · Anglais, niveau précis · <b>Centres d'intérêt</b> · trois éléments concrets</p></div><div class="tpl"><p><b>Message au manager SDR (LinkedIn ou email)</b></p><p><i>Objet : SDR chez [Entreprise] · [signal récent]</i></p><p>Bonjour [Prénom], je viens de postuler au poste de SDR. Pour vous montrer comment je prospecte, j'ai préparé une séquence de 3 emails pour [un persona de votre cible]. Je vous l'envoie ?</p></div>`},
 amis:{t:"Questions pour des pros du métier",i:"users",d:"Pour un SDR ou BDR en poste et un AE ou Account Manager de ton réseau : amis, anciens de ton école, contacts LinkedIn. Prends des notes, elles nourriront tes entretiens.",html:`<ol><li>Comment s'est passé ton recrutement, étape par étape ? Y avait-il une mise en situation d'appel ?</li><li>À quoi ressemble ta semaine type : combien d'appels, d'emails, de rendez-vous ?</li><li>Sur quels indicateurs es-tu évalué, et quel est ton objectif mensuel ?</li><li>Quels outils utilises-tu chaque jour ?</li><li>Qu'est-ce qui distingue les SDR qui réussissent des autres ?</li><li>Qu'est-ce qui a été le plus dur pendant tes trois premiers mois ?</li><li>Quelles ressources et quelles certifications t'ont vraiment aidé ?</li><li>En quoi le métier d'Account Manager diffère-t-il de celui de SDR ou de BDR ?</li><li>L'alternance est-elle une bonne porte d'entrée, et comment l'as-tu obtenue ?</li><li>Que me conseilles-tu de mettre en avant, venant de mon parcours ?</li><li>Accepterais-tu de me faire passer un mock call avant mes entretiens ?</li><li>Pourrais-tu me recommander si un poste ouvre chez toi ?</li></ol>`}
};

/* ---------- État ---------- */
const KEY="sta-progress-v1",TKEY="sta-theme";
let S=norm({});
function norm(o){o=o||{};return {name:o.name||"",start:o.start||null,done:Object.assign({},o.done||{}),log:Object.assign({},o.log||{}),certs:Object.assign({},o.certs||{}),known:Object.assign({},o.known||{}),qbest:o.qbest||0};}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)S=norm(JSON.parse(r));}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Dates ---------- */
const pad=n=>(n<10?"0":"")+n;
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2],12);};
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d;};
const isWE=d=>{const w=d.getDay();return w===0||w===6;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fLong=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fMonth=new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
function weekdaysBefore(a,b){let n=0;const x=new Date(a);while(x<b){if(!isWE(x))n++;x.setDate(x.getDate()+1);}return n;}
function plannedOn(d){if(!S.start||isWE(d))return 0;const s=parse(S.start);if(d<s)return 0;const n=weekdaysBefore(s,d)+1;return n<=TOTAL?n:0;}
function sessionDate(n){if(!S.start)return null;const x=parse(S.start);let c=0;for(let i=0;i<500;i++){if(!isWE(x)){c++;if(c===n)return new Date(x);}x.setDate(x.getDate()+1);}return null;}
function nextMonday(){const t=today();return addDays(t,(8-t.getDay())%7||7);}

/* ---------- Progression ---------- */
const tid=(n,i)=>"s"+n+"-"+i;
const sCount=s=>s.k.reduce((c,_,i)=>c+(S.done[tid(s.n,i)]?1:0),0);
const sDone=s=>sCount(s)===s.k.length;
const doneSessions=()=>SES.filter(sDone).length;
const nextSession=()=>SES.find(s=>!sDone(s))||null;
const active=ds=>(S.log[ds]||0)>0;
function bump(){const d=ymd(today());S.log[d]=(S.log[d]||0)+1;}
function streakNow(){let d=today(),n=0;if(!active(ymd(d)))d=addDays(d,-1);for(let i=0;i<800;i++){if(active(ymd(d)))n++;else if(!isWE(d))break;d=addDays(d,-1);}return n;}
function bestStreak(){const ks=Object.keys(S.log).filter(active).sort();if(!ks.length)return 0;let d=parse(ks[0]);const end=today();let run=0,best=0;while(d<=end){if(active(ymd(d))){run++;if(run>best)best=run;}else if(!isWE(d))run=0;d=addDays(d,1);}return best;}
const certsDone=()=>C.filter(c=>S.certs[c[0]]==="done").length;
const knownCount=()=>G.filter(g=>S.known[g[0]]).length;
const xp=()=>Object.keys(S.done).length*XP_TASK+doneSessions()*XP_SES+certsDone()*XP_CERT+knownCount()*XP_WORD;
function level(x){let i=0;while(i+1<LEVELS.length&&x>=LEVELS[i+1][0])i++;const cur=LEVELS[i],nx=LEVELS[i+1];return {i,name:cur[1],from:cur[0],to:nx?nx[0]:cur[0],next:nx?nx[1]:null};}
function todayTasks(){const d=ymd(today());return Object.values(S.done).filter(v=>v===d).length;}
const modSessions=mi=>SES.filter(s=>s.m===mi);
const modDone=mi=>modSessions(mi).filter(sDone).length;

/* ---------- Synchronisation avec le compte Claude (si disponible) ---------- */
let dbRef=null,dirty=false,writing=false,again=false,wTimer=null,firstSnap=true,syncMode="local";
function syncText(){return syncMode==="db"?"Progression enregistrée sur ton compte, sur tous tes appareils.":syncMode==="connecting"?"Connexion à ton compte…":"Progression enregistrée dans ce navigateur.";}
function setSync(m){syncMode=m;const el=$("sync");if(!el)return;el.className="sync"+(m==="db"?" db":"");el.lastElementChild.textContent=syncText();}
function mergeState(a,b){const o=norm(b);
  Object.keys(a.done).forEach(k=>{if(!o.done[k]||a.done[k]<o.done[k])o.done[k]=a.done[k];});
  Object.keys(a.log).forEach(k=>{o.log[k]=Math.max(o.log[k]||0,a.log[k]);});
  Object.keys(a.certs).forEach(k=>{if(o.certs[k]!=="done")o.certs[k]=a.certs[k];});
  Object.keys(a.known).forEach(k=>{o.known[k]=o.known[k]||a.known[k];});
  o.start=o.start||a.start||null;o.name=o.name||a.name||"";o.qbest=Math.max(o.qbest||0,a.qbest||0);return o;}
function canon(o){const r={name:o.name,start:o.start||null,qbest:o.qbest};["done","log","certs","known"].forEach(f=>{r[f]={};Object.keys(o[f]).sort().forEach(k=>{r[f][k]=o[f][k];});});return JSON.stringify(r);}
function queueWrite(){if(!dbRef){dirty=false;return;}clearTimeout(wTimer);wTimer=setTimeout(flush,500);}
function flush(){
  if(!dbRef){dirty=false;return;}
  if(writing){again=true;return;}
  writing=true;
  const body=JSON.parse(JSON.stringify({name:S.name,done:S.done,log:S.log,start:S.start||null,certs:S.certs,known:S.known,qbest:S.qbest,v:3}));
  dbRef.set(body).then(()=>{},e=>{const c=e&&e.code;if(c==="unavailable"){setTimeout(()=>{dirty=true;queueWrite();},1500+Math.random()*1500);}else{dbRef=null;setSync("local");}})
  .then(()=>{writing=false;if(again){again=false;flush();return;}dirty=false;});
}
function initDb(){
  const c=window.claude;if(!c||typeof c.use!=="function")return;
  Promise.all([c.use("db"),c.use("user")]).then(r=>{
    const db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(id=>{
      if(!id)return;
      try{dbRef=db.doc("data/users/"+id+"/progress");}catch(e){dbRef=null;return;}
      setSync("connecting");
      const timer=setTimeout(()=>{if(syncMode==="connecting")setSync("local");},10000);
      dbRef.onSnapshot(snap=>{
        const conf=!snap.metadata.fromCache;
        if(conf)clearTimeout(timer);
        if(dirty||writing){if(conf)setSync("db");return;}
        if(snap.exists){
          const remote=norm(snap.data());
          if(firstSnap){const merged=mergeState(S,remote);S=merged;saveLocal();if(conf){firstSnap=false;if(canon(merged)!==canon(remote)){dirty=true;queueWrite();}}}
          else{S=remote;saveLocal();}
          render(false);
        }else if(conf){
          firstSnap=false;
          if(Object.keys(S.done).length||Object.keys(S.log).length||S.start||S.name||Object.keys(S.certs).length||Object.keys(S.known).length){dirty=true;queueWrite();}
        }
        if(conf)setSync("db");
      },()=>{clearTimeout(timer);dbRef=null;setSync("local");});
    });
  }).catch(()=>{});
}
function commit(){dirty=true;saveLocal();queueWrite();}

/* ---------- Thème ---------- */
function getTheme(){try{return localStorage.getItem(TKEY)||"system";}catch(e){return "system";}}
function applyTheme(t){try{localStorage.setItem(TKEY,t);}catch(e){}if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);}

/* ---------- Composants ---------- */
function ring(p,size,sw,inner,color){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,p)));
  return `<div class="ringwrap" style="width:${size}px;height:${size}px${color?";--c:"+color:""}"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/><circle class="pr" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><span>${inner||""}</span></div>`;}
const bar=(p,color,cls)=>`<div class="bar${cls?" "+cls:""}"${color?` style="--c:${color}"`:""}><i style="width:${Math.round(Math.max(0,Math.min(1,p))*100)}%"></i></div>`;
const isInt=r=>r[2]&&r[2][0]==="#";
function typeChip(r){return (r[4]==="Certification"||r[4]==="Badge")?`<span class="chip cert">${ic("award")}${r[4]==="Badge"?"Badge":"Certifiant"}</span>`:`<span class="chip">${h(r[4])}</span>`;}
function linkAttrs(r){return isInt(r)?`href="${h(r[2])}"`:`href="${h(r[2])}" target="_blank" rel="noopener"`;}
function resList(ids){
  if(!ids||!ids.length)return "";
  return '<ul class="res">'+ids.map(id=>{const r=R[id];if(!r)return "";
    const col=isInt(r)?mc(F[+id.slice(1)-1].m):provColor(r[1]);
    const inner=`<span class="pm" style="background:${col}">${isInt(r)?ic("doc","width:16px;height:16px;stroke:var(--on-c)"):h(provMono(r[1]))}</span><span class="rt"><b>${h(r[0])}</b><span>${h(r[1])}${isInt(r)?" · dans le site":""}</span></span><span class="rc"><span class="chip">${h(r[3])}</span>${typeChip(r)}</span>`;
    return `<li><a ${linkAttrs(r)}>${inner}</a></li>`;}).join("")+"</ul>";
}
function band(inner,c,cls){return `<section class="band gutter${cls?" "+cls:""}"${c?` style="--c:${c}"`:""}><div class="inner">${inner}</div></section>`;}
const wrap=inner=>`<div class="wrap gutter"><div class="inner">${inner}</div></div>`;

/* ---------- En-tête et navigation ---------- */
const NAVLINKS=[["accueil","Accueil"],["parcours","Parcours",1],["apprendre","Apprendre",1],["certifications","Certifications"],["ressources","Ressources",1]];
function curSection(v){return v==="seance"?"parcours":["fiches","fiche","glossaire","outils"].includes(v)?"apprendre":v;}
function ddParcours(){
  const nxt=nextSession();
  const col=(a,b,lab)=>`<div><p class="dd-h">${lab}</p>${M.slice(a,b).map((m,j)=>{const mi=a+j;return `<a class="dd-l" href="#module-${mi+1}" style="--c:${mc(mi)}"><span class="dn">${mi+1}</span><span><b>${h(m.t)}</b><small>Semaine ${mi+1} · ${modDone(mi)}/5 séances</small></span></a>`;}).join("")}</div>`;
  const tc=nxt?`<a class="today-card" href="#seance-${nxt.n}" style="--c:${mc(nxt.m)}"><span class="eyebrow" style="color:var(--c)">Prochaine séance · ${nxt.n}/${TOTAL}</span><b>${h(nxt.t)}</b><span>${sCount(nxt)}/${nxt.k.length} tâches faites</span></a>`:"";
  return `<div class="dd mega"><div class="ddp">${col(0,5,"Partie 1 · Apprendre le métier")}<div>${col(5,8,"Partie 2 · Décrocher le poste").replace(/^<div>|<\/div>$/g,"")}${tc}</div><div class="foot-l"><span class="muted">${doneSessions()} séance${doneSessions()>1?"s":""} sur ${TOTAL} terminée${doneSessions()>1?"s":""}</span><a href="#parcours">Voir tout le parcours →</a></div></div></div>`;
}
const APPR=[["fiches","Fiches de cours","8 fiches écrites pour la formation","doc","var(--m1)"],["glossaire","Glossaire",G.length+" termes en français et en anglais","book","var(--m3)"],["quiz","Quiz de vocabulaire","10 questions, ton meilleur score","quiz","var(--m4)"],["cartes","Cartes mémoire","Révise et marque ce que tu sais","cards","var(--m5)"],["outils","Boîte à outils","Grille d'appel, STAR, pitch, CV","tool","var(--m7)"]];
function ddApprendre(){return `<div class="dd"><div class="ddp" style="width:340px">${APPR.map(a=>`<a class="dd-l" href="#${a[0]}" style="--c:${a[4]}"><span class="di">${ic(a[3])}</span><span><b>${a[1]}</b><small>${a[2]}</small></span></a>`).join("")}</div></div>`;}
function countType(k){const t=RTYPES[k][1];return t?Object.values(R).filter(r=>t.includes(r[4])).length:NRES;}
function ddRessources(){const icons={all:"lib",cours:"play",certifs:"award",lecture:"doc",media:"mic",terrain:"users"};return `<div class="dd" style="left:auto;right:-80px"><div class="ddp" style="width:330px">${Object.keys(RTYPES).map((k,i)=>`<a class="dd-l" href="#ressources${k==="all"?"":"-"+k}" style="--c:${mc(i)}"><span class="di">${ic(icons[k])}</span><span><b>${RTYPES[k][0]}</b><small>${countType(k)} ressources gratuites</small></span></a>`).join("")}</div></div>`;}
function chrome(v){
  const cur=curSection(v),x=xp(),lv=level(x),st=streakNow(),lit=active(ymd(today()));
  $("nav").innerHTML=NAVLINKS.map(n=>{
    const ac=cur===n[0]?' aria-current="page"':"";
    if(!n[2])return `<div class="ni"><a class="nl" href="#${n[0]}"${ac}>${n[1]}</a></div>`;
    const dd=n[0]==="parcours"?ddParcours():n[0]==="apprendre"?ddApprendre():ddRessources();
    return `<div class="ni" data-ni="${n[0]}"><button class="nl" type="button" aria-haspopup="true"${ac}>${n[1]}${ic("down").replace('class="ico"','class="ico chev"')}</button>${dd}</div>`;}).join("");
  $("pills").innerHTML=`<span class="pill fl${lit?"":" off"}" title="Série de jours">${flame()}<span>${st}</span></span><span class="pill xp" title="Points d'expérience">${ic("bolt")}<span>${x}</span></span>`;
  const theme=getTheme(),ini=(S.name||"?").trim().charAt(0).toUpperCase()||"?";
  $("prof").innerHTML=`<button class="avatar" type="button" aria-haspopup="true" aria-label="Mon profil">${h(ini)}</button><div class="dd"><div class="ddp"><div><b style="font-family:var(--display);font-size:17px">${S.name?h(S.name):"Invité"}</b><div class="muted" style="font-size:13px">${S.start?"Début le "+h(fLong.format(parse(S.start))):"Date de début non choisie"}</div></div>
   <div class="lvl"><div class="row" style="justify-content:space-between"><b>Niveau ${lv.i+1} · ${h(lv.name)}</b><span class="mono" style="font-size:12px;color:var(--xp)">${x} XP</span></div>${bar(lv.next?(x-lv.from)/(lv.to-lv.from):1,null,"xpb")}<small>${lv.next?(lv.to-x)+" XP avant « "+h(lv.next)+" »":"Niveau maximum atteint"}</small></div>
   <div><p class="dd-h" style="padding:0 0 6px">Thème</p><div class="seg" role="group" aria-label="Thème" style="width:100%">${[["system","Système"],["light","Clair"],["dark","Sombre"]].map(t=>`<button type="button" data-theme-set="${t[0]}" aria-pressed="${theme===t[0]}" style="flex:1">${t[1]}</button>`).join("")}</div></div>
   <button class="dd-l" type="button" data-act="profile"><span class="di">${ic("edit")}</span><span><b>Modifier mon profil</b><small>Prénom et date de début</small></span></button>
   <button class="dd-l" type="button" data-act="reset" style="--c:var(--m8)"><span class="di">${ic("reset")}</span><span><b>${resetArm?"Confirmer : tout effacer":"Réinitialiser ma progression"}</b><small>${resetArm?"Clique encore pour confirmer":"Séances, XP, série et certifications"}</small></span></button>
  </div></div>`;
}
let resetArm=false,resetTimer=null;
function closeMenus(){document.querySelectorAll(".ni.open").forEach(n=>n.classList.remove("open"));}

/* ---------- Tiroir mobile ---------- */

  const d=document.createElement("div");d.className="drawer";d.id="drawer";
  const lv=level(xp());
  d.innerHTML=`<div class="drawer-p" role="dialog" aria-modal="true" aria-label="Menu"><div class="drawer-top"><span class="row" style="gap:6px"><span class="pill fl" style="background:color-mix(in srgb,var(--flame) 14%,var(--surface));color:var(--flame)">${flame()}<span>${streakNow()}</span></span><span class="pill" style="background:color-mix(in srgb,var(--xp) 14%,var(--surface));color:var(--xp)">${ic("bolt")}<span>${xp()}</span></span></span><button class="iconbtn" type="button" data-close-drawer aria-label="Fermer">${ic("x")}</button></div>
