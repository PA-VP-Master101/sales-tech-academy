   [2,"Qu'est-ce qui coince le plus : préparer les arrivées, ou faire monter les nouveaux en compétence pendant le premier mois ?","Le premier mois. Les managers n'ont pas le temps de les former, et on a eu 4 départs en période d'essai.","Une question de découverte qui fait préciser le problème. Elle te donne un fait concret (4 départs) pour justifier le rendez-vous."],
   [1,"C'est justement notre spécialité ! Talento automatise tout l'onboarding.","Tout le monde dit ça… Notre vrai souci, c'est le premier mois : 4 départs en période d'essai.","Tu sautes sur la solution trop tôt. Creuse d'abord le problème : c'est lui qui rend ton rendez-vous légitime."],
   [0,"Ah oui, c'est le cas de toutes les scale-ups, vous n'êtes pas la seule.","Merci, ça me rassure… Bon, on a quand même eu 4 départs en période d'essai.","Minimiser son problème, c'est lui dire qu'il n'est pas important. Reformule et creuse plutôt que de généraliser."]]},
  {o:[
   [2,"4 départs en période d'essai, c'est 4 recrutements à refaire. 20 minutes jeudi à 10 h ou vendredi à 11 h, pour vous montrer comment d'autres DRH de scale-ups s'organisent ?","Jeudi 10 h, ça me va.","Tu reprends ses mots, tu chiffres l'enjeu et tu proposes deux créneaux. C'est le rendez-vous parfait.",0,"RDV posé · jeudi 10 h"],
   [1,"Je vous envoie une documentation et je vous rappelle la semaine prochaine ?","Oui, envoyez toujours.","Elle était prête pour un rendez-vous et tu repars avec une promesse vague. Quand le problème est sur la table, demande une date.",0,"Documentation envoyée, pas de date"],
   [0,"Vous avez un budget prévu pour un outil d'onboarding cette année ?","Euh… il faudrait voir avec la direction. Je vous laisse, j'ai une réunion.","Qualifier le budget, c'est le rôle du rendez-vous, pas du premier appel. Ici, la question casse l'élan.",0,"Appel perdu"]]}
 ]},
 {id:"mail",t:"« Envoyez-moi un mail »",obj:"Transformer la demande de mail en rendez-vous",lvl:2,m:3,ses:18,av:"TM",g:"linear-gradient(140deg,#FFB020,#CF3A84)",n:"Thomas M. · Head of Sales",co:"Fintech · 60 salariés",who:"Thomas M., Head of Sales",sig:"La fintech a 4 postes de SDR ouverts.",goal:"Obtenir un rendez-vous daté, pas seulement l'envoi d'un mail.",skill:"Objection « mail », chiffrer le problème",
  k:["Accepte l'objection « mail », puis pose une question pour le personnaliser.","Chiffre le coût du problème avec les mots du prospect.","Le mail doit préparer un rendez-vous daté, pas le remplacer."],
  st:[
  {p:"Thomas, j'écoute.",o:[
   [2,"Bonjour Thomas, {moi} de Talento. Je vous appelle au sujet de vos 4 postes de SDR ouverts. Je peux vous poser une question rapide ?","Écoutez, envoyez-moi un mail, je regarderai.","Ouverture précise : son signal (4 postes de SDR) et une demande de permission. L'objection « mail » est un réflexe pour écourter l'appel."],
   [1,"Bonjour Thomas, {moi} de Talento. On aide les équipes commerciales à intégrer leurs nouveaux. Ça vous parle ?","Mouais. Envoyez-moi un mail, je regarderai.","« Ça vous parle ? » est trop vague. Appuie-toi sur un fait précis sur son entreprise : il prouve que tu as fait tes recherches."],
   [0,"Bonjour, est-ce que vous êtes la bonne personne pour parler de formation des commerciaux ?","Non. Voyez avec les RH. Au revoir.","Si tu ne sais pas qui est la bonne personne, tu n'as pas préparé ton appel. Le Head of Sales qui recrute des SDR est évidemment concerné.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Avec plaisir. Pour qu'il vous serve vraiment : le plus dur aujourd'hui, c'est de recruter vos SDR ou de les faire monter en compétence ?","La montée en compétence. Ils mettent trois mois à être autonomes.","Tu acceptes la demande et tu poses une question pour personnaliser le mail. Le prospect répond presque toujours : l'appel continue."],
   [1,"D'accord, quelle est votre adresse ?","Thomas, arobase, le nom de la boîte… Bon, c'est sur quoi ? Notre souci, c'est la montée en compétence : trois mois avant qu'un SDR soit autonome.","Tu obéis à l'objection et l'appel s'arrête presque. Ici, il relance de lui-même ; la plupart du temps, ton mail finira non lu."],
   [0,"Les mails, personne ne les lit. Je préfère vous expliquer maintenant, ça ira plus vite.","C'est moi qui décide de comment j'utilise mon temps. Au revoir.","Contredire le prospect le braque. Reconnais toujours sa demande avant de rebondir.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Trois mois, c'est un trimestre de quota en moins par SDR. Comment les formez-vous aujourd'hui ?","Du shadowing avec les seniors et un dossier partagé de docs. Ça prend du temps à tout le monde.","Tu chiffres l'impact (un trimestre de quota) et tu explores la situation actuelle. Le prospect mesure le coût du statu quo."],
   [1,"Avec Talento, vous pourriez diviser ce délai par deux.","Tout le monde promet ça. On forme en shadowing avec les seniors, et ça marche à peu près.","Une promesse sans preuve sonne creux. Pose d'abord une question, la preuve viendra au rendez-vous."],
   [0,"Trois mois, c'est normal pour un SDR, non ?","Justement, je ne trouve pas ça normal. On fait du shadowing avec les seniors, et ça prend du temps à tout le monde.","Tu minimises un problème qu'il vient de te confier. Montre que tu l'as entendu, puis creuse."]]},
  {o:[
   [2,"Je vous envoie le cas d'une fintech passée de 3 mois à 6 semaines, et on en parle 15 minutes mardi à 9 h 30 ou mercredi à 14 h ?","Mardi matin. Envoyez l'invitation.","Tu tiens ta promesse (le mail) et tu l'attaches à un rendez-vous daté. Le mail devient la préparation du rendez-vous.",0,"RDV posé · mardi 9 h 30"],
   [1,"Je vous envoie le mail, et je vous rappelle vendredi pour en discuter ?","Si vous voulez.","Mieux que rien, mais un rappel n'est pas un rendez-vous. Il ne sera peut-être pas disponible vendredi.",0,"Rappel prévu vendredi"],
   [0,"Je vous envoie notre brochure complète avec la grille tarifaire.","D'accord. Merci, au revoir.","Une brochure et des prix sans rendez-vous : tu as transformé un prospect intéressé en lecteur passif.",0,"Appel perdu"]]}
 ]},
 {id:"outil",t:"« On a déjà un outil »",obj:"Trouver le manque sans critiquer l'existant",lvl:2,m:3,ses:18,av:"SB",g:"linear-gradient(140deg,#7A4ECF,#2B7BDD)",n:"Sarah B. · Directrice financière",co:"E-commerce · 250 salariés",who:"Sarah B., directrice financière",sig:"40 recrutements cette année ; l'entreprise utilise déjà un SIRH.",goal:"Obtenir un rendez-vous ou une introduction au bon décideur.",skill:"Objection « déjà un outil », angle financier",
  k:["Ne critique jamais l'outil en place : cherche ce qui manque.","Adapte ton angle au persona : des chiffres pour une directrice financière.","Une introduction interne vers le bon décideur est une victoire."],
  st:[
  {p:"Sarah B., bonjour.",o:[
   [2,"Bonjour Sarah, {moi} de Talento. On ne se connaît pas : je vous prends 30 secondes, et vous me dites si on continue ?","Allez-y, 30 secondes.","Être transparent (« on ne se connaît pas ») et demander la permission désamorce la méfiance d'un appel à froid."],
   [1,"Bonjour Sarah, {moi} de Talento. Je ne vais pas vous prendre longtemps, promis !","Bon. Allez-y.","« Je ne vais pas vous prendre longtemps » est vague. Un délai précis (30 secondes) est plus crédible et plus facile à accepter."],
   [0,"Bonjour, je souhaiterais parler de vos coûts de recrutement, vous avez 15 minutes ?","15 minutes ? Non. Bonne journée.","15 minutes pour un appel non prévu, c'est trop. Demande 30 secondes, puis gagne la suite.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Vous avez recruté 40 personnes cette année. Vous savez combien vous coûte un départ pendant la période d'essai ?","Aucune idée. Et de toute façon, on a déjà un outil RH.","Une directrice financière parle chiffres : tu poses une question sur un coût, pas sur un outil. L'objection arrive, elle est classique."],
   [1,"Talento aide les entreprises à mieux intégrer leurs nouveaux salariés.","On a déjà un outil RH pour ça.","Une phrase générique sur ton produit. Pour une directrice financière, parle d'impact financier."],
   [0,"Je travaille avec plusieurs de vos concurrents, et ils sont ravis.","Tant mieux pour eux. On a déjà un outil. Au revoir.","Citer des concurrents sans preuve ni question ressemble à de la pression. Commence par son problème.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Très bien. Qu'est-ce qui marche bien avec cet outil, et qu'est-ce qui coince encore ?","Il gère bien l'administratif. Mais le suivi après le premier mois, c'est le flou.","Tu ne critiques pas l'outil en place : tu cherches le manque. Il y en a presque toujours un."],
   [1,"Lequel ? Talento s'intègre avec la plupart des SIRH.","Lucca. Il gère l'administratif, mais pour le suivi après le premier mois, c'est le flou.","L'intégration est un bon argument, mais trop tôt. Demande d'abord ce qui manque."],
   [0,"Notre outil est beaucoup plus complet que ce que vous avez.","Vous ne savez même pas ce qu'on utilise. Au revoir.","Dénigrer l'existant sans le connaître, c'est perdre toute crédibilité.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Le suivi après le premier mois, c'est là que se jouent la plupart des départs en période d'essai. Qui pilote ce sujet chez vous : vous, ou la DRH ?","C'est Camille, notre DRH. Je la mets en copie : voyez avec elle, et tenez-moi au courant.","Tu identifies le bon décideur et repars avec une introduction interne. Une directrice financière qui te recommande à sa DRH vaut mieux qu'un rendez-vous forcé.",0,"Mise en relation · DRH en copie"],
   [1,"Je peux vous envoyer une étude sur le coût des départs en période d'essai ?","Si vous voulez, je la lirai… peut-être.","Tu repars sans prochaine étape claire. Avec une directrice financière, propose le bon interlocuteur ou un rendez-vous avec un enjeu chiffré.",0,"Étude envoyée, pas de suite"],
   [0,"On peut remplacer votre outil pour moins cher, vous voulez un devis ?","On vient de signer pour trois ans. Non merci.","Proposer de remplacer un outil qu'elle vient de choisir la met en défaut. Positionne-toi en complément.",0,"Appel perdu"]]}
 ]},
 {id:"budget",t:"« Pas de budget »",obj:"Faire chiffrer le coût du problème",lvl:2,m:3,ses:18,av:"KH",g:"linear-gradient(140deg,#FF7A4D,#BF720A)",n:"Karim H. · Directeur général",co:"Groupe de restaurants · 300 salariés",who:"Karim H., directeur général",sig:"Le groupe ouvre trois restaurants au printemps : 120 recrutements saisonniers.",goal:"Obtenir un rendez-vous malgré l'objection budget.",skill:"Objection budget, chiffrage",
  k:["L'objection budget est souvent une information, pas un refus.","Fais chiffrer le coût du problème par le prospect lui-même.","Un SDR ne négocie pas : il obtient un rendez-vous qualifié."],
  st:[
  {p:"Karim, j'écoute.",o:[
   [2,"Bonjour Karim, {moi} de Talento. Vous ouvrez trois restaurants ce printemps : je vous appelle au sujet des 120 recrutements qui vont avec. Vous avez une minute ?","Une minute. Mais je vous préviens : on n'a pas de budget pour de nouveaux outils cette année.","Signal précis, raison claire, permission. Il pose l'objection budget d'entrée : c'est une information, pas un refus."],
   [1,"Bonjour, {moi} de Talento. On fait des logiciels RH. Vous avez des projets en ce moment ?","Des projets, oui. Du budget, non : rien de prévu pour de nouveaux outils cette année.","Question trop ouverte : il ne sait pas pourquoi tu appelles. Prépare un signal concret."],
   [0,"Bonjour, vous avez 5 minutes pour une démo rapide de notre logiciel ?","Non. Pas le temps, pas de budget. Au revoir.","Proposer une démo dès la première phrase, c'est sauter toutes les étapes.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"C'est noté, et je ne vous demande rien aujourd'hui. Par curiosité : combien de vos saisonniers partent avant la fin du premier mois ?","Trop. Un sur quatre, peut-être. Chaque départ, c'est un recrutement à refaire en pleine saison.","Tu reconnais l'objection sans la combattre et tu ramènes la conversation sur son problème. Le budget suit la douleur, pas l'inverse."],
   [1,"Talento ne coûte que 6 euros par salarié et par mois.","Même 6 euros, sur 300 salariés… Notre vrai sujet, c'est qu'un saisonnier sur quatre part avant la fin du mois.","Parler prix avant d'avoir établi la valeur, c'est entrer dans une négociation que tu ne peux pas gagner."],
   [0,"Il y a toujours du budget quand le projet est important.","Vous m'expliquez comment gérer mon entreprise ? Au revoir.","Une phrase toute faite qui contredit le prospect. Reconnais, puis questionne.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Un sur quatre sur 120 recrutements, c'est 30 personnes à remplacer en pleine saison. Combien vous coûte un recrutement, à peu près ?","Entre l'annonce, le temps des managers et la formation… 1 500 euros, au moins.","Tu fais calculer le coût du problème par le prospect lui-même : 30 × 1 500 €, c'est 45 000 €. Le budget devient un investissement."],
   [1,"C'est énorme ! Talento peut réduire ça de moitié.","Ah oui ? Il faudrait le prouver. Un recrutement nous coûte au moins 1 500 euros.","Promettre un résultat sans l'avoir fait chiffrer reste abstrait. Laisse-le calculer le coût ; la preuve viendra au rendez-vous."],
   [0,"C'est le secteur qui veut ça, la restauration a toujours eu du turnover.","Merci, je sais. Ça nous coûte au moins 1 500 euros par recrutement.","Tu normalises son problème : il n'a plus de raison de le résoudre. Creuse-le au lieu de l'excuser."]]},
  {o:[
   [2,"30 départs à 1 500 euros, c'est 45 000 euros par saison. 20 minutes mardi à 15 h ou jeudi à 10 h pour voir si on peut en économiser une partie ? Si ce n'est pas le cas, je vous le dirai.","45 000… Jeudi 10 h. Mais je veux des chiffres concrets.","L'enjeu est chiffré, la demande est datée, et « si ce n'est pas le cas, je vous le dirai » rassure. Le budget sera traité au rendez-vous, avec l'AE.",0,"RDV posé · jeudi 10 h"],
   [1,"Je vous rappelle en janvier, quand vous aurez un nouveau budget ?","En janvier, pourquoi pas.","Le problème existe maintenant, en pleine saison. Reporter au budget suivant, c'est laisser passer 45 000 euros de pertes.",0,"Rappel en janvier"],
   [0,"On peut vous faire une remise de 30 % si vous signez ce mois-ci.","Je ne signe rien au téléphone. Au revoir.","Un SDR ne négocie pas et ne vend pas au téléphone : il obtient un rendez-vous. La remise dévalorise ton offre.",0,"Appel perdu"]]}
 ]},
 {id:"sixmois",t:"« Rappelez-moi dans six mois »",obj:"Montrer que le problème est déjà là",lvl:2,m:3,ses:18,av:"JP",g:"linear-gradient(140deg,#1C9655,#2B7BDD)",n:"Julien P. · CEO",co:"Startup SaaS · 45 salariés",who:"Julien P., CEO",sig:"La startup vient de lever 8 M€ et annonce vouloir doubler l'équipe en un an.",goal:"Obtenir un rendez-vous avant les prochaines arrivées.",skill:"Objection « plus tard », urgence",
  k:["« Rappelez-moi dans six mois » veut souvent dire « pas maintenant ».","Utilise les chiffres du prospect pour montrer que le problème est déjà là.","Invite la personne opérationnelle au rendez-vous."],
  st:[
  {p:"Oui, Julien.",o:[
   [2,"Bonjour Julien, {moi} de Talento. Félicitations pour votre levée. Vous annoncez doubler l'équipe en un an : c'est pour ça que je vous appelle. Je vous prends 30 secondes ?","Merci. Écoutez, rappelez-moi dans six mois, là on est sous l'eau.","Un signal récent, une félicitation sincère, puis la raison de l'appel. « Dans six mois » est une façon polie de dire « pas maintenant »."],
   [1,"Bonjour Julien, {moi} de Talento. J'ai vu que vous recrutiez, vous avez une minute ?","On recrute, oui. Rappelez-moi dans six mois, là on est sous l'eau.","Correct, mais « vous recrutez » est vague. La levée de fonds et l'objectif de doubler l'équipe sont des signaux bien plus forts."],
   [0,"Bonjour Julien, vous avez levé 8 millions : vous avez du budget, c'est parfait pour Talento !","Charmant… On n'a pas levé pour vous. Au revoir.","Associer sa levée à ton budget est maladroit : il entend que tu viens chercher son argent.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Je comprends, et je rappellerai si c'est le bon moment. Justement : si vous passez de 45 à 90 personnes, une bonne partie arrive dans les six prochains mois, non ?","Oui… 15 arrivées le mois prochain, et personne pour les accueillir correctement.","Tu respectes sa demande et tu montres, avec ses propres chiffres, que le sujet est maintenant, pas dans six mois."],
   [1,"D'accord, je note de vous rappeler en mai.","Parfait. Enfin… si c'est sur l'accueil des nouveaux, on en a 15 qui arrivent le mois prochain, et c'est un peu le flou.","Tu as cédé trop vite : sans sa relance, l'appel s'arrêtait là. Avant de noter un rappel, vérifie que le problème n'est pas déjà là."],
   [0,"Dans six mois, il sera trop tard, vous allez le regretter.","Je prends le risque. Au revoir.","La peur et la pression ne marchent pas sur un CEO. Fais-lui trouver l'urgence par lui-même.",1,"Le prospect a raccroché"]]},
  {o:[
   [2,"Qui s'occupe de l'onboarding aujourd'hui : vous, ou une personne dédiée ?","Moi, et notre office manager. Mais on n'a pas de vrai process : chaque manager fait à sa façon.","Tu identifies qui porte le sujet. Dans une startup, le CEO décide souvent, mais quelqu'un d'autre fera le travail : tu auras besoin des deux."],
   [1,"Talento vous permet de créer un parcours d'onboarding en une journée.","En une journée ? On n'a même pas de vrai process : chaque manager fait à sa façon…","Tu pitches au lieu d'explorer. Il te donne l'information malgré tout ; la prochaine fois, va la chercher avec une question."],
   [0,"15 personnes, ça va, ce n'est pas énorme.","Pour nous, c'est un tiers de l'équipe. Et on n'a pas de vrai process : chaque manager fait à sa façon.","Ne minimise jamais l'enjeu du prospect. Pour une équipe de 45, 15 arrivées, c'est énorme."]]},
  {o:[
   [2,"Alors n'attendons pas six mois : 20 minutes avant l'arrivée des 15, avec votre office manager, pour poser un process simple. Lundi 9 h ou mardi 17 h ?","Mardi 17 h. J'invite Clara, notre office manager.","Tu ramènes le rendez-vous avant l'échéance réelle (les 15 arrivées) et tu invites la personne opérationnelle. Rendez-vous de qualité.",0,"RDV posé · mardi 17 h"],
   [1,"Je vous envoie un guide sur l'onboarding en startup, et on se reparle dans six mois ?","Envoyez le guide, merci.","Le guide est une bonne attention, mais tu acceptes le délai alors que le problème arrive le mois prochain.",0,"Guide envoyé, rappel dans six mois"],
   [0,"Je vous ouvre un accès d'essai pour que vous testiez seul ?","Je n'ai pas le temps de tester un outil seul. Rappelez-moi dans six mois.","Un essai sans accompagnement, c'est du travail en plus pour un CEO débordé. Propose un rendez-vous qui lui fait gagner du temps.",0,"Appel perdu"]]}
 ]},
 {id:"decouverte",t:"La découverte SPIN",obj:"Qualifier un rendez-vous et le transmettre à l'AE",lvl:3,m:4,ses:22,av:"CR",g:"linear-gradient(140deg,#2CC9B5,#7A4ECF)",n:"Camille R. · DRH",co:"Scale-up SaaS · 180 salariés",who:"Camille R., DRH",sig:"Rendez-vous de découverte de 15 minutes, obtenu lors de ton appel à froid.",goal:"Qualifier le besoin et caler une démo avec l'AE.",skill:"SPIN, BANT, passation",
  k:["Pose le cadre en début de rendez-vous.","SPIN : situation, problème, implication, bénéfice attendu.","Qualifie le calendrier et le décideur avant de passer la main.","Une bonne passation : l'AE ne fait pas répéter le prospect."],
  st:[
  {n:"Jeudi, 10 h. Visio de découverte de 15 minutes.",p:"Bonjour ! Alors, je vous écoute.",o:[
   [2,"Merci Camille. Je vous propose : quelques questions sur votre onboarding, et si c'est pertinent, on cale une démo avec mon collègue. Ça vous va ? Pour commencer, comment se passe l'arrivée d'un nouveau aujourd'hui ?","Ça me va. Le contrat est signé dans le SIRH, le manager reçoit un mail, et ensuite… chaque manager fait un peu à sa façon.","Tu poses le cadre (programme, durée, prochaine étape possible), puis une question de situation ouverte. La prospect sait où tu l'emmènes."],
   [1,"Merci Camille. Combien de personnes recrutez-vous par an, quel SIRH utilisez-vous, et combien de managers avez-vous ?","Euh… une centaine par an, Lucca, une vingtaine de managers. Et chaque manager fait un peu à sa façon.","Trois questions fermées d'affilée ressemblent à un interrogatoire. Cherche ces données avant le rendez-vous et pose une question ouverte."],
   [0,"Merci Camille. Je vais commencer par vous présenter Talento en quelques slides.","Ah… d'accord. En fait, chez nous, chaque manager fait un peu à sa façon.","Une découverte n'est pas une démo. Si tu présentes avant de comprendre, tu parles de ce qui ne l'intéresse peut-être pas."]]},
  {o:[
   [2,"Quand chaque manager fait à sa façon, qu'est-ce qui se passe concrètement pour les nouveaux ?","Certains sont très bien accueillis, d'autres attendent leur ordinateur trois jours. Et on a eu 4 départs en période d'essai ce semestre.","Question de problème (le P de SPIN) : tu fais décrire les conséquences concrètes, sans les suggérer."],
   [1,"Ce n'est pas trop compliqué à gérer ?","Si, un peu. Certains attendent leur ordinateur trois jours, et on a eu 4 départs en période d'essai ce semestre.","Question fermée et orientée : elle suggère la réponse. Une question ouverte fait parler davantage."],
   [0,"Avec Talento, chaque manager suit le même parcours, automatiquement.","D'accord… Mais ce n'est pas mon seul problème : on a eu 4 départs en période d'essai ce semestre.","Tu entends un problème et tu pitches aussitôt. Creuse : chaque question supplémentaire révèle un enjeu plus fort."]]},
  {o:[
   [2,"4 départs en période d'essai : qu'est-ce que ça vous a coûté, en temps et en argent ?","Quatre recrutements à refaire, deux mois de retard pour l'équipe produit… Notre CEO m'a demandé un plan pour le prochain comité.","Question d'implication : la prospect mesure elle-même la gravité. Et tu découvres un enjeu clé : le CEO attend un plan (urgence et décideur)."],
   [1,"Ça doit vous coûter cher, non ?","Oui, quatre recrutements à refaire. Notre CEO m'a demandé un plan pour le prochain comité.","Bonne intention, mais question fermée. « Qu'est-ce que ça vous a coûté ? » fait chiffrer et raconter."],
   [0,"C'est dans la moyenne du marché, vous savez.","Peut-être, mais notre CEO m'a demandé un plan pour le prochain comité.","Rassurer la prospect sur son problème, c'est réduire son envie d'agir."]]},
  {o:[
   [2,"Si tous les nouveaux étaient accueillis de la même façon, avec un suivi au premier mois, qu'est-ce que ça changerait pour ce plan ? Et ce comité, c'est quand ?","Ce serait exactement ce que je dois présenter. Le comité est le 12. C'est le CEO qui valide, sur ma recommandation.","Bénéfice attendu (le N de SPIN) : elle formule elle-même la valeur. Puis tu qualifies le calendrier et le décideur, le T et le A de BANT."],
   [1,"Vous avez un budget pour ce projet ?","Ça dépendra de ce que je présente au comité, le 12. C'est le CEO qui valide.","Le budget n'est pas tabou, mais trop tôt il ferme la conversation. Laisse-la d'abord formuler le bénéfice."],
   [0,"Donc vous êtes prête à signer ?","Non, quand même pas. Il y a un comité le 12, et c'est le CEO qui valide.","Pousser à la signature n'est pas le rôle du SDR. Ton objectif : qualifier, puis transmettre à l'AE."]]},
  {o:[
   [2,"Je vous propose une démo de 30 minutes avec Antoine, notre AE, mardi à 10 h, pour construire avec vous la recommandation du 12. Je lui transmets tout ce que vous m'avez dit : vous n'aurez rien à répéter.","Parfait, mardi 10 h. Merci, c'était utile.","Prochaine étape datée, alignée sur son échéance (le comité), avec une passation propre à l'AE. C'est une affaire qualifiée.",0,"Démo AE · mardi 10 h"],
   [1,"Je vous envoie une proposition commerciale cette semaine ?","Euh, je préfère d'abord voir l'outil.","Une proposition avant la démo, c'est trop tôt : elle n'a pas vu le produit et l'AE n'a pas encore travaillé le besoin.",0,"À relancer pour une démo"],

 [1,"Quelle est la mission principale d'un SDR ?",["Créer des rendez-vous qualifiés pour les Account Executives","Signer les contrats avec les nouveaux clients","Accompagner les clients après la signature","Fixer les prix des offres"],"Le SDR vend un rendez-vous, pas le produit. C'est l'AE qui mène la vente jusqu'à la signature."],
 [1,"Dans beaucoup d'entreprises, qu'est-ce qui distingue le BDR du SDR ?",["Le BDR prospecte surtout des comptes qui n'ont rien demandé (outbound)","Le BDR signe les contrats","Le BDR gère les clients après la vente","Le BDR travaille uniquement à l'international"],"Le SDR traite souvent l'entrant (inbound), le BDR le sortant (outbound). Dans d'autres entreprises, les deux titres désignent le même poste."],
 [1,"Que mesure le MRR ?",["Le revenu récurrent mensuel","Le nombre de rendez-vous du mois","La marge brute","Le taux de réponse aux emails"],"MRR : Monthly Recurring Revenue. Avec l'ARR (annuel), c'est l'indicateur central d'une entreprise SaaS."],
 [1,"Que désigne le churn ?",["La part de clients ou de revenu perdue sur une période","Le nombre de nouveaux clients","Le coût d'acquisition d'un client","La durée du cycle de vente"],"Le churn mesure l'attrition : les clients qui partent. Un SaaS qui churne beaucoup doit acquérir encore plus."],
 [1,"Qui reprend le rendez-vous obtenu par le SDR et mène la vente ?",["L'Account Executive","Le Customer Success Manager","Le directeur financier du prospect","Le SDR lui-même"],"L'AE mène la démo, la négociation et la signature. Le CSM prend le relais après la signature."],
 [1,"Que signifie CAC ?",["Le coût d'acquisition d'un client","Le chiffre d'affaires cumulé","Le contrat annuel client","Le cycle d'achat complet"],"CAC : Customer Acquisition Cost. Il se compare à la valeur d'un client sur sa durée de vie (LTV)."],
 [2,"Que décrit un ICP ?",["Le type d'entreprise qui tire le plus de valeur du produit","La personne qui signe le contrat","La liste des concurrents","Le prix idéal du produit"],"ICP : Ideal Customer Profile. Secteur, taille, zone, signaux : c'est le portrait de l'entreprise à cibler."],

 [2,"Lequel de ces éléments est un signal d'achat ?",["L'entreprise vient de lever des fonds et recrute 30 personnes","L'entreprise existe depuis dix ans","Son site internet a un blog","Elle est installée à Paris"],"Un signal est un événement récent qui rend ton produit utile maintenant : levée, recrutements, nouveau dirigeant, ouverture."],
 [2,"Pourquoi un signal doit-il dater de moins de trois mois ?",["Parce qu'il justifie d'appeler maintenant","Parce que LinkedIn efface les anciens posts","Parce que c'est une obligation légale","Ça n'a aucune importance"],"Un signal récent donne une raison crédible d'appeler aujourd'hui. Un signal ancien ne crée plus d'urgence."],
 [2,"À quoi sert LinkedIn Sales Navigator ?",["Trouver des comptes et des contacts avec des filtres avancés, et suivre leurs signaux","Envoyer des factures","Enregistrer les appels","Remplacer le CRM"],"Sales Navigator sert au ciblage et à la veille. Le suivi des échanges et des affaires reste dans le CRM."],
 [3,"Un cold email efficace…",["est court, part d'un signal et se termine par une seule demande","présente toutes les fonctionnalités du produit","contient une plaquette en pièce jointe","commence par « Je me permets de vous contacter »"],"Cinq lignes au plus, un signal réel, une demande simple : c'est le critère du module 3."],
 [3,"Quel objet de cold email a le plus de chances d'être ouvert ?",["Vos 25 recrutements","Présentation de Talento, leader de l'onboarding","URGENT : opportunité à saisir","Re: notre échange (alors qu'il n'y en a pas eu)"],"Court, personnel, sans promesse ni fausse relance. Un faux « Re: » détruit la confiance dès l'ouverture."],
 [3,"Qu'est-ce qu'une séquence multicanale ?",["Plusieurs prises de contact espacées, par email, téléphone et LinkedIn","Le même email envoyé à 500 personnes","Un email avec plusieurs destinataires en copie","Une relance par jour pendant un mois"],"Une séquence alterne les canaux sur deux à trois semaines, chaque touche apportant quelque chose de nouveau."],
 [3,"Dans une invitation LinkedIn envoyée à un prospect, il vaut mieux…",["personnaliser en une phrase, sans pitch","présenter ton produit en détail","proposer directement une démo","joindre ton CV"],"L'invitation ouvre une relation. Le pitch dans la note fait refuser l'invitation."],
 [4,"Dans un cold call, la raison de l'appel doit arriver…",["en moins de 30 secondes","après deux minutes de présentation","à la fin de l'appel","seulement si le prospect la demande"],"C'est le critère du module 4 : le prospect doit savoir très vite pourquoi tu l'appelles."],
 [4,"Quelle est la bonne méthode face à une objection ?",["Reconnaître, poser une question, rebondir","Argumenter jusqu'à convaincre","Ignorer l'objection et suivre le script","Proposer une remise"],"Reconnaître montre que tu as écouté, la question fait parler, et le rebond ramène vers le rendez-vous."],
 [4,"Le prospect dit « Envoyez-moi un mail ». Quelle est la meilleure réponse ?",["Accepter, puis poser une question pour personnaliser le mail","Raccrocher et envoyer la plaquette","Répondre que personne ne lit les mails","Insister pour présenter le produit"],"Accepter désamorce. La question qui suit relance presque toujours la conversation."],

 [4,"Pourquoi éviter « Comment allez-vous ? » en ouverture d'appel ?",["Ça signale un appel commercial et retarde la raison de l'appel","C'est impoli","C'est interdit par la loi","Le prospect ne comprendra pas la question"],"Les premières secondes doivent dire qui tu es et pourquoi tu appelles."],
 [5,"Que signifie BANT ?",["Budget, Authority, Need, Timeline","Business, Account, Network, Target","Budget, Action, Negotiation, Time","Buyer, Agent, Need, Team"],"Budget, pouvoir de décision, besoin, calendrier : la grille de qualification la plus utilisée par les SDR."],

 [5,"À quoi sert surtout MEDDIC ?",["Qualifier les ventes complexes à plusieurs décideurs","Rédiger des emails","Calculer le MRR","Recruter des SDR"],"Metrics, Economic buyer, Decision criteria, Decision process, Identify pain, Champion."],
 [5,"Que contient une bonne passation à l'AE ?",["Le contexte, le problème, l'enjeu, le décideur, le calendrier et la prochaine étape","Seulement le nom et le numéro du prospect","La plaquette envoyée au prospect","L'avis personnel du SDR sur le prospect"],"L'AE ne doit jamais faire répéter le prospect. Tout ce que tu as appris va dans le CRM."],

/* ---------- État ---------- */
const KEY="sta-progress-v1",TKEY="sta-theme";
let S=norm({});
function norm(o){o=o||{};const ex=o.exam||{};return {name:o.name||"",start:o.start||null,done:Object.assign({},o.done||{}),log:Object.assign({},o.log||{}),certs:Object.assign({},o.certs||{}),known:Object.assign({},o.known||{}),qbest:o.qbest||0,sim:Object.assign({},o.sim||{}),exam:{best:ex.best||0,att:ex.att||0,pass:ex.pass||null},tools:JSON.parse(JSON.stringify(o.tools||{}))};}

/* ---------- Dates ---------- */
const pad=n=>(n<10?"0":"")+n;
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2],12);};
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d;};
const isWE=d=>{const w=d.getDay();return w===0||w===6;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fLong=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fMonth=new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
function weekdaysBefore(a,b){let n=0;const x=new Date(a);while(x<b){if(!isWE(x))n++;x.setDate(x.getDate()+1);}return n;}
function plannedOn(d){if(!S.start||isWE(d))return 0;const s=parse(S.start);if(d<s)return 0;const n=weekdaysBefore(s,d)+1;return n<=TOTAL?n:0;}
function sessionDate(n){if(!S.start)return null;const x=parse(S.start);let c=0;for(let i=0;i<500;i++){if(!isWE(x)){c++;if(c===n)return new Date(x);}x.setDate(x.getDate()+1);}return null;}
function nextMonday(){const t=today();return addDays(t,(8-t.getDay())%7||7);}

/* ---------- Progression ---------- */
const tid=(n,i)=>"s"+n+"-"+i;
const sCount=s=>s.k.reduce((c,_,i)=>c+(S.done[tid(s.n,i)]?1:0),0);
const sDone=s=>sCount(s)===s.k.length;
const doneSessions=()=>SES.filter(sDone).length;
const nextSession=()=>SES.find(s=>!sDone(s))||null;
const active=ds=>(S.log[ds]||0)>0;
function bump(){const d=ymd(today());S.log[d]=(S.log[d]||0)+1;}
function streakNow(){let d=today(),n=0;if(!active(ymd(d)))d=addDays(d,-1);for(let i=0;i<800;i++){if(active(ymd(d)))n++;else if(!isWE(d))break;d=addDays(d,-1);}return n;}
function bestStreak(){const ks=Object.keys(S.log).filter(active).sort();if(!ks.length)return 0;let d=parse(ks[0]);const end=today();let run=0,best=0;while(d<=end){if(active(ymd(d))){run++;if(run>best)best=run;}else if(!isWE(d))run=0;d=addDays(d,1);}return best;}
const certsDone=()=>C.filter(c=>S.certs[c[0]]==="done").length;
const knownCount=()=>G.filter(g=>S.known[g[0]]).length;
const xp=()=>Object.keys(S.done).length*XP_TASK+doneSessions()*XP_SES+certsDone()*XP_CERT+knownCount()*XP_WORD+simWon()*XP_SIM+(S.exam.pass?XP_EXAM:0);
function level(x){let i=0;while(i+1<LEVELS.length&&x>=LEVELS[i+1][0])i++;const cur=LEVELS[i],nx=LEVELS[i+1];return {i,name:cur[1],from:cur[0],to:nx?nx[0]:cur[0],next:nx?nx[1]:null};}
function todayTasks(){const d=ymd(today());return Object.values(S.done).filter(v=>v===d).length;}
const modSessions=mi=>SES.filter(s=>s.m===mi);
const modDone=mi=>modSessions(mi).filter(sDone).length;

/* ---------- Synchronisation avec le compte Claude (si disponible) ---------- */
let dbRef=null,dirty=false,writing=false,again=false,wTimer=null,firstSnap=true,syncMode="local";
function syncText(){return syncMode==="db"?"Progression enregistrée sur ton compte, sur tous tes appareils.":syncMode==="connecting"?"Connexion à ton compte…":syncMode==="cloud"?"Progression synchronisée avec ton compte, sur tous tes appareils.":syncMode==="cloud-off"?"Hors ligne : tes changements sont gardés ici et partiront au retour du réseau.":syncMode==="cloud-err"?"Synchronisation momentanément indisponible : ta progression reste enregistrée ici.":syncMode==="cloud-out"?"Session expirée : reconnecte-toi pour synchroniser ta progression.":"Progression enregistrée dans ce navigateur.";}
function setSync(m){syncMode=m;const el=$("sync");if(el){el.className="sync"+syncCls();el.lastElementChild.textContent=syncText();}const av=document.querySelector("#prof .avatar");if(av)av.classList.toggle("on",m==="cloud"||m==="db");if(acc&&acc.m.isConnected&&acc.mode==="account")accPaint();}
function mergeState(a,b){const o=norm(b);
  Object.keys(a.done).forEach(k=>{if(!o.done[k]||a.done[k]<o.done[k])o.done[k]=a.done[k];});
  Object.keys(a.log).forEach(k=>{o.log[k]=Math.max(o.log[k]||0,a.log[k]);});
  Object.keys(a.certs).forEach(k=>{if(o.certs[k]!=="done")o.certs[k]=a.certs[k];});
  Object.keys(a.known).forEach(k=>{o.known[k]=o.known[k]||a.known[k];});
  Object.keys(a.sim).forEach(k=>{const x=a.sim[k],y=o.sim[k];o.sim[k]=y?{b:Math.max(x.b||0,y.b||0),n:Math.max(x.n||0,y.n||0),d:(x.d||"")>(y.d||"")?x.d:y.d}:x;});
  o.exam.best=Math.max(o.exam.best,a.exam.best);o.exam.att=Math.max(o.exam.att,a.exam.att);if(a.exam.pass&&(!o.exam.pass||a.exam.pass.s>o.exam.pass.s))o.exam.pass=a.exam.pass;
  Object.keys(a.tools).forEach(k=>{if(!o.tools[k])o.tools[k]=a.tools[k];});
  o.start=o.start||a.start||null;o.name=o.name||a.name||"";o.qbest=Math.max(o.qbest||0,a.qbest||0);return o;}
function canon(o){const r={name:o.name,start:o.start||null,qbest:o.qbest,exam:o.exam};["done","log","certs","known","sim","tools"].forEach(f=>{r[f]={};Object.keys(o[f]).sort().forEach(k=>{r[f][k]=o[f][k];});});return JSON.stringify(r);}
function queueWrite(){if(!dbRef){dirty=false;return;}clearTimeout(wTimer);wTimer=setTimeout(flush,500);}
function flush(){
  if(!dbRef){dirty=false;return;}
  if(writing){again=true;return;}
  writing=true;
  const body=JSON.parse(JSON.stringify({name:S.name,done:S.done,log:S.log,start:S.start||null,certs:S.certs,known:S.known,qbest:S.qbest,sim:S.sim,exam:S.exam,tools:S.tools,v:4}));
  dbRef.set(body).then(()=>{},e=>{const c=e&&e.code;if(c==="unavailable"){setTimeout(()=>{dirty=true;queueWrite();},1500+Math.random()*1500);}else{dbRef=null;setSync("local");}})
  .then(()=>{writing=false;if(again){again=false;flush();return;}dirty=false;});
}
function initDb(){
  const c=window.claude;if(!c||typeof c.use!=="function")return;
  Promise.all([c.use("db"),c.use("user")]).then(r=>{
    const db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(id=>{
      if(!id)return;
      try{dbRef=db.doc("data/users/"+id+"/progress");}catch(e){dbRef=null;return;}
      setSync("connecting");
      const timer=setTimeout(()=>{if(syncMode==="connecting")setSync("local");},10000);
      dbRef.onSnapshot(snap=>{
        const conf=!snap.metadata.fromCache;
        if(conf)clearTimeout(timer);
        if(dirty||writing){if(conf)setSync("db");return;}
        if(snap.exists){
          const remote=norm(snap.data());
          if(firstSnap){const merged=mergeState(S,remote);S=merged;saveLocal();if(conf){firstSnap=false;if(canon(merged)!==canon(remote)){dirty=true;queueWrite();}}}
          else{S=remote;saveLocal();}
          render(false);
        }else if(conf){
          firstSnap=false;
          if(Object.keys(S.done).length||Object.keys(S.log).length||S.start||S.name||Object.keys(S.certs).length||Object.keys(S.known).length||Object.keys(S.sim).length||S.exam.att||Object.keys(S.tools).length){dirty=true;queueWrite();}
        }
        if(conf)setSync("db");
      },()=>{clearTimeout(timer);dbRef=null;setSync("local");});
    });
  }).catch(()=>{});
}
function commit(){dirty=true;saveLocal();queueWrite();cDirty();}

/* ---------- Comptes utilisateurs et synchronisation (site en ligne, Supabase) ----------
   Actif seulement si config.js fournit l'URL du projet et la clé publique. Sinon, rien ne change :
   la progression reste dans le navigateur. La bibliothèque n'est chargée que si elle sert. */
const CL=window.STA_CLOUD||{};
const CLOUD_ON=!!document.querySelector('link[rel="manifest"]')&&/^https:\/\/[a-z0-9.-]+(:\d+)?\/?$/i.test(CL.url||"")&&typeof CL.key==="string"&&CL.key.length>20;
const SB_SRC="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js",SB_SRI="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK";
const CONTACT=typeof window.STA_CONTACT==="string"&&/^[^\s@<>"]+@[^\s@<>"]+\.[a-z]{2,}$/i.test(window.STA_CONTACT.trim())?window.STA_CONTACT.trim():"";
const AUTH_KEY="sta-auth",CMKEY="sta-cloud-v1",NUDGE_DAYS=14;
let sb=null,sbP=null,cUser=null,cAdmin=null,cPushing=false,cAgain=false,cTimer=null,cRetry=null,cTry=0,cLastPull=0,cWelcome=false,acc=null;
let cMeta=(()=>{try{return JSON.parse(localStorage.getItem(CMKEY)||"null")||{};}catch(e){return {};}})();
function cmSave(){try{localStorage.setItem(CMKEY,JSON.stringify(cMeta));}catch(e){}}
function hasSession(){try{return !!localStorage.getItem(AUTH_KEY);}catch(e){return false;}}
const hasProgress=o=>Object.keys(o.done).length>0||o.exam.att>0||Object.keys(o.sim).length>0||Object.keys(o.known).length>0;
const authBase=()=>location.origin+location.pathname;
const syncCls=()=>syncMode==="db"||syncMode==="cloud"?" db":syncMode.indexOf("cloud-")===0?" warn":"";

function sbLoad(){
  if(sb)return Promise.resolve(sb);
  if(sbP)return sbP;
  sbP=new Promise((res,rej)=>{
    const make=()=>{try{
      sb=window.supabase.createClient(CL.url.replace(/\/$/,""),CL.key,{auth:{flowType:"implicit",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:AUTH_KEY}});
      sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>cAuth(ev,ses),0);});
      res(sb);}catch(e){sb=null;sbP=null;rej(e);}};
    if(window.supabase&&window.supabase.createClient){make();return;}
    const s=document.createElement("script");s.src=SB_SRC;s.integrity=SB_SRI;s.crossOrigin="anonymous";s.async=true;
    s.onload=make;s.onerror=()=>{s.remove();sbP=null;rej(new Error("offline"));};
    document.head.appendChild(s);
  });
  return sbP;
}
function cAuth(ev,ses){
  const u=ses&&ses.user||null;
  if(ev==="PASSWORD_RECOVERY"){cSetUser(u);openAccount("newpw");return;}
  if(ev==="SIGNED_OUT"){cGone();return;}
  if(ev==="TOKEN_REFRESHED")return;
  if(ev==="USER_UPDATED"){if(u&&cUser&&u.id===cUser.id)cUser=u;return;}
  cSetUser(u);
}
/* Session terminée sans passer par « Se déconnecter » : expirée, révoquée, ou compte supprimé ailleurs */
function cGone(){
  if(!cUser){if(syncMode==="connecting")setSync(cMeta.uid?"cloud-out":"local");return;}
  cUser=null;cAdmin=null;setSync(cMeta.uid?"cloud-out":"local");render(false);
}
function cSetUser(u){
  if(!u){if(cUser)cGone();else if(syncMode==="connecting")setSync(cMeta.uid?"cloud-out":"local");return;}
  if(cUser&&cUser.id===u.id){cUser=u;return;}
  const first=cMeta.uid!==u.id;
  cUser=u;cAdmin=null;
  if(first)cMeta={uid:u.id,synced:null,dirty:true,nudge:cMeta.nudge};
  cMeta.email=u.email||"";cmSave();
  setSync("connecting");render(false);
  cPull();
  sb.rpc("is_admin").then(r=>{cAdmin=!r.error&&r.data===true;chrome(route().v);if(route().v==="admin")render(false);if(acc&&acc.m.isConnected&&acc.mode==="account")accPaint();},()=>{cAdmin=false;});
}
/* Lecture du compte. Changements locaux en attente : on fusionne. Sinon, le compte fait foi. */
async function cPull(){
  if(!cUser)return;
  const uid=cUser.id;cLastPull=Date.now();
  let r;try{r=await sb.from("progress").select("data,updated_at").eq("user_id",uid).maybeSingle();}catch(e){r={error:e};}
  if(!cUser||cUser.id!==uid)return;
  if(r.error){cFail(r.error);return;}
  const row=r.data;
  if(!row){
    if(hasProgress(S)||S.name||S.start){cMeta.dirty=true;cmSave();await cPush();}
    else{cMeta.dirty=false;cmSave();cOk();}
    cHello(false);return;
  }
  const remote=norm(row.data);
  if(cMeta.dirty&&cMeta.synced&&row.updated_at===cMeta.synced){
    await cPush();
  }else if(cMeta.dirty){
    const merged=cMeta.synced?mergeState(remote,S):mergeState(S,remote),changed=canon(merged)!==canon(S);
    S=merged;saveLocal();
    if(changed)render(false);
    if(canon(merged)!==canon(remote))await cPush();
    else{cMeta.dirty=false;cMeta.synced=row.updated_at;cMeta.at=Date.now();cmSave();cOk();}
  }else if(row.updated_at!==cMeta.synced){
    S=remote;saveLocal();cMeta.synced=row.updated_at;cMeta.at=Date.now();cmSave();cOk();render(false);
  }else{cMeta.at=Date.now();cmSave();cOk();}
  cHello(true);
}
function cRow(uid){
  const days=Object.keys(S.log).filter(active).sort();
  return {user_id:uid,name:(S.name||"").slice(0,40),data:JSON.parse(JSON.stringify(S)),sessions_done:doneSessions(),xp:xp(),exam_best:S.exam.best||0,exam_passed:!!S.exam.pass,last_active:days.length?days[days.length-1]:null};
}
async function cPush(){
  clearTimeout(cTimer);cTimer=null;
  if(!cUser)return;
  if(cPushing){cAgain=true;return;}
  cPushing=true;const uid=cUser.id;
  try{
    const cur=await sb.from("progress").select("data,updated_at").eq("user_id",uid).maybeSingle();
    if(cur.error)throw cur.error;
    if(!cUser||cUser.id!==uid)return;
    if(cur.data&&cur.data.updated_at!==cMeta.synced){const m=mergeState(norm(cur.data.data),S);if(canon(m)!==canon(S)){S=m;saveLocal();render(false);}}
    const sent=canon(S);
    const w=await sb.from("progress").upsert(cRow(uid),{onConflict:"user_id"}).select("updated_at").single();
    if(w.error)throw w.error;
    if(!cUser||cUser.id!==uid)return;
    cMeta.synced=w.data.updated_at;cMeta.at=Date.now();
    if(canon(S)===sent&&!cAgain)cMeta.dirty=false;
    cmSave();cOk();
  }catch(e){cFail(e);}
  finally{cPushing=false;if(cAgain){cAgain=false;if(cUser&&cMeta.dirty)await cPush();}}
}
function cOk(){clearTimeout(cRetry);cRetry=null;cTry=0;setSync("cloud");}
function cFail(e){
  const net=!navigator.onLine||!e||e.status===0||/fetch|network|load failed|offline/i.test(String(e&&e.message||e));
  if(!net)console.warn("Synchronisation du compte :",e);
  setSync(net?"cloud-off":"cloud-err");
  if(!cRetry){const wait=Math.min(120000,5000*Math.pow(2,cTry++));cRetry=setTimeout(()=>{cRetry=null;if(!cUser)return;if(cMeta.dirty)cPush();else cPull();},wait);}
}
/* Appelée par commit() : chaque changement part vers le compte, regroupé toutes les 1,2 s */
function cDirty(){
  if(!CLOUD_ON||!cMeta.uid)return;
  cMeta.dirty=true;cmSave();
  if(cUser){clearTimeout(cTimer);cTimer=setTimeout(cPush,1200);}
}
function cRefresh(){
  if(!cUser||cPushing)return;
  if(cMeta.dirty){if(!cTimer)cPush();return;}
  if(Date.now()-cLastPull<15000)return;
  cPull();
}
function cHello(had){
  if(!cWelcome)return;cWelcome=false;
  if(route().v==="decouvrir")location.hash="accueil";else render(false);
  const n=doneSessions();
  toast(ic("check")+" "+(had&&n?"Connecté : ta progression est à jour ("+n+" séance"+(n>1?"s":"")+" terminée"+(n>1?"s":"")+").":"Connecté : ta progression est enregistrée sur ton compte."));
}
function cWipe(){
  clearTimeout(cTimer);clearTimeout(cRetry);cTimer=cRetry=null;cUser=null;cAdmin=null;adm.L=null;adm.err=null;
  S=norm({});exRun=null;try{localStorage.removeItem(KEY);localStorage.removeItem(EXKEY);}catch(e){}
  cMeta={nudge:cMeta.nudge};cmSave();setSync("local");
  if(location.hash==="#accueil"||!location.hash||location.hash==="#")render(true);else location.hash="accueil";
}
function cloudInit(){
  if(!CLOUD_ON)return;
  const hs=location.hash.slice(1);
  if(/(^|&)(error_description|error_code)=/.test(hs)){
    const code=new URLSearchParams(hs).get("error_code")||"";
    history.replaceState(null,"",location.pathname+location.search+"#accueil");
    setTimeout(()=>openAccount("login",{msg:{t:"err",x:code==="otp_expired"?"Ce lien a expiré ou a déjà servi. Connecte-toi, ou redemande un lien avec « Mot de passe oublié ».":"Ce lien n'a pas pu être utilisé. Connecte-toi, ou redemande un lien avec « Mot de passe oublié »."}}),400);
  }
  if(/(^|&)access_token=/.test(hs)||hasSession()){
    setSync("connecting");
    sbLoad().catch(()=>{if(syncMode==="connecting")setSync(cMeta.uid?"cloud-off":"local");});
    setTimeout(()=>{if(syncMode==="connecting"&&!cUser)setSync(cMeta.uid?"cloud-off":"local");},12000);
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")cRefresh();else if(cTimer)cPush();});
  window.addEventListener("online",()=>{if(!cUser)return;cTry=0;clearTimeout(cRetry);cRetry=null;if(cMeta.dirty)cPush();else cPull();});
  window.addEventListener("offline",()=>{if(cUser&&cMeta.dirty)setSync("cloud-off");});
}

const AUTH_ERR={invalid_credentials:"Email ou mot de passe incorrect.",email_not_confirmed:"Confirme d'abord ton adresse : clique sur le lien reçu par email.",user_already_exists:"Un compte existe déjà avec cet email : connecte-toi.",email_exists:"Un compte existe déjà avec cet email : connecte-toi.",weak_password:"Mot de passe trop facile à deviner : 8 caractères au moins, mélange lettres et chiffres.",same_password:"Choisis un mot de passe différent de l'ancien.",email_address_invalid:"Cette adresse email n'est pas acceptée. Vérifie-la.",validation_failed:"Vérifie l'adresse email et le mot de passe.",over_email_send_rate_limit:"Trop d'emails envoyés d'un coup. Réessaie dans quelques minutes.",over_request_rate_limit:"Trop de tentatives. Patiente une minute avant de réessayer.",signup_disabled:"Les inscriptions sont fermées pour le moment.",email_provider_disabled:"Les inscriptions par email sont fermées pour le moment.",session_not_found:"Ta session a expiré. Reconnecte-toi.",user_not_found:"Aucun compte n'existe avec cet email."};

async function accSubmit(e){

function admChart(steps,drop){

function admHover(ch){

  const show=t=>{const i=+t.getAttribute("data-i");tip.innerHTML=admTip(i);tip.hidden=false;
    const r=ch.getBoundingClientRect(),b=t.getBoundingClientRect(),w=tip.offsetWidth;let x=b.left+b.width/2-r.left;x=Math.max(w/2,Math.min(r.width-w/2,x));tip.style.left=x+"px";const bp=svg.querySelector(`.fb[data-i="${i}"]`),bt=bp&&bp.getBBox().height?bp.getBoundingClientRect().top:b.top+b.height*.8;tip.style.top=Math.max(-6,bt-r.top-10)+"px";
    svg.classList.add("hov");svg.querySelectorAll(".fb.hi").forEach(e=>e.classList.remove("hi"));const p=svg.querySelector(`.fb[data-i="${i}"]`);if(p)p.classList.add("hi");};

}

function admCSV(){

function pageTitle(r){
  const v=r.v;let t="";
  if(v==="accueil")t=S.name?"Tableau de bord":"";
  else if(v==="decouvrir")t="Découvrir la formation";
  else if(v==="parcours")t="Le parcours";
  else if(v==="module")t=M[r.mi]?`Module ${r.mi+1} · ${M[r.mi].t}`:"Le parcours";
  else if(v==="seance"){const s=SES[r.n-1];t=s?`Séance ${s.n} · ${s.t}`:"Le parcours";}
  else if(v==="certifications")t="Certifications";
  else if(v==="glossaire")t=gMode==="quiz"?"Quiz de vocabulaire":gMode==="cards"?"Cartes mémoire":"Glossaire";
  else if(v==="ressources")t=rType!=="all"&&RTYPES[rType]?RTYPES[rType][0]:"Bibliothèque de ressources";
  else if(v==="outils")t="Boîte à outils";
  else if(v==="fiches")t="Fiches de cours";
  else if(v==="fiche")t=F[r.n-1]?F[r.n-1].t:"Fiches de cours";
  else if(v==="simulateur")t="Simulateur d'appel";
  else if(v==="sim"){const sc=SIMS.find(x=>x.id===r.id);t=sc?sc.t+" · Simulateur":"Simulateur d'appel";}
  else if(v==="atelier")t=AT[r.id]?AT[r.id].t+" · Atelier d'écriture":"Atelier d'écriture";
  else if(v==="examen")t="Examen final";
  else if(v==="certificat")t=S.exam.pass?"Mon certificat":"Examen final";

  else if(v==="faq")t="Questions fréquentes";
  else if(v==="confidentialite")t="Confidentialité";
  else if(v==="404")t="Page introuvable";
  return typo(t?t+" · Sales Tech Academy":"Sales Tech Academy · La formation SDR & BDR");
}

  const inp=m.querySelector("#pf-name");setTimeout(()=>inp.focus(),50);
  m.querySelector("#pf").addEventListener("submit",e=>{e.preventDefault();const n=inp.value.trim();if(!n){inp.focus();return;}

    commit();close();if(isNew){location.hash="accueil";render(true);toast("Bienvenue "+h(S.name)+". Premier coup de burin : la séance 1 t'attend.");}else{render(false);toast("Profil enregistré");}});
}

/* ---------- Palette de recherche ---------- */
let palIndex=null;
function buildIndex(){
  const it=[];
  SES.forEach(s=>it.push({g:"Séances",t:`Séance ${s.n} · ${s.t}`,s:M[s.m].t,href:"#seance-"+s.n,k:String(s.n),c:mc(s.m)}));
  M.forEach((m,i)=>it.push({g:"Modules",t:`Module ${i+1} · ${m.t}`,s:m.obj,href:"#module-"+(i+1),k:"M"+(i+1),c:mc(i)}));
  F.forEach((f,i)=>it.push({g:"Fiches",t:f.t,s:f.sub,href:"#fiche-"+(i+1),ic:"doc",c:mc(f.m)}));
  trainMenu().forEach(a=>it.push({g:"S'entraîner",t:a[1],s:a[2],href:"#"+a[0],ic:a[3],c:a[4]}));
  SIMS.forEach(sc=>it.push({g:"Simulateur d'appel",t:sc.t,s:sc.obj+" · "+LVL[sc.lvl],href:"#simulateur-"+sc.id,ic:"phone",c:"var(--m4)"}));
  AT_ORDER.forEach(id=>it.push({g:"Atelier d'écriture",t:AT[id].t,s:AT[id].s,href:"#atelier-"+id,ic:AT[id].i,c:AT[id].c}));
  faqData().forEach(g=>g[1].forEach(q=>it.push({g:"Questions fréquentes",t:q[0],s:g[0],href:"#faq",ic:"info",c:"var(--m3)"})));
  it.push({g:"Questions fréquentes",t:"Confidentialité et données",s:"Ce que le site enregistre et comment tout effacer",href:"#confidentialite",ic:"lock",c:"var(--m2)"});
  TOOLS_ORDER.forEach(id=>it.push({g:"Outils",t:TOOLS[id].t,s:TOOLS[id].d,tool:id,ic:TOOLS[id].i,c:"var(--m7)"}));
  C.forEach(c=>it.push({g:"Certifications",t:c[1],s:c[2]+" · "+c[4],href:"#certifications",ic:"award",c:"var(--m6)"}));
  G.forEach(g=>it.push({g:"Glossaire",t:g[0]+" · "+g[1],s:g[2],gloss:g[0],ic:"book",c:mc(Math.min(g[3],8)-1)}));
  Object.keys(R).forEach(id=>{const r=R[id];if(!isInt(r))it.push({g:"Ressources",t:r[0],s:r[1]+" · "+r[3]+" · "+r[4],href:r[2],ext:1,k:provMono(r[1]),c:provColor(r[1])});});
  return it;
}
const norm2=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function openPalette(){
  if(document.querySelector(".pal"))return;
  palIndex=palIndex||buildIndex();
  const m=document.createElement("div");m.className="modal pal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Recherche");
  m.innerHTML=`<div class="palbox"><div class="palin">${ic("search","color:var(--muted)")}<input id="pal-q" type="text" placeholder="Séance, fiche, terme, ressource…" autocomplete="off" aria-label="Rechercher dans la formation"><kbd>Échap</kbd></div><div class="pallist" id="pal-list" role="listbox"></div></div>`;
  $("fx").appendChild(m);
  const q=m.querySelector("#pal-q"),list=m.querySelector("#pal-list");let res=[],sel=0;
  function draw(){
    const v=norm2(q.value.trim());
    if(!v){const nx=nextSession();res=(nx?[palIndex.find(x=>x.href==="#seance-"+nx.n)]:[]).concat(palIndex.filter(x=>x.g==="S'entraîner"||x.g==="Fiches"||x.g==="Outils"));}
    else{const terms=v.split(/\s+/);res=palIndex.filter(x=>{const hay=norm2(x.t+" "+x.s);return terms.every(t=>hay.includes(t));}).slice(0,40);}
    sel=Math.min(sel,Math.max(0,res.length-1));
    if(!res.length){list.innerHTML='<div class="palempty">Aucun résultat. Essaie un autre mot, en français ou en anglais.</div>';return;}
    let g="",html="";
    res.forEach((x,i)=>{if(x.g!==g){g=x.g;html+=`<div class="palgrp">${v?h(g):(i===0&&x.g==="Séances"?"Prochaine séance":h(g))}</div>`;}
      html+=`<a class="palit" role="option" data-i="${i}" aria-selected="${i===sel}" ${x.href?(x.ext?`href="${h(x.href)}" target="_blank" rel="noopener"`:`href="${x.href}"`):'href="#" '} style="--c:${x.c}"><span class="pk">${x.ic?ic(x.ic):h(x.k||"")}</span><span style="min-width:0"><b>${h(x.t)}</b><small>${h(x.s)}</small></span>${x.ext?ic("ext","width:15px;height:15px;color:var(--muted);margin-left:auto"):""}</a>`;});
    list.innerHTML=html;
    const s=list.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:"nearest"});
  }
  function go(x){if(!x)return;close();if(x.tool){openTool(x.tool);return;}if(x.gloss){gMode="list";gMod=0;gQuery=x.gloss;if(location.hash==="#glossaire")render(false);else location.hash="glossaire";return;}if(x.ext){return;}location.hash=x.href.slice(1);}
  function close(){m.remove();document.removeEventListener("keydown",key,true);}
  function key(e){
    if(e.key==="Escape"){e.preventDefault();close();}
    else if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(res.length-1,sel+1);draw();}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw();}
    else if(e.key==="Enter"){const x=res[sel];if(x&&x.ext){const a=list.querySelector(`[data-i="${sel}"]`);if(a)a.click();close();}else{e.preventDefault();go(x);}}
  }
  document.addEventListener("keydown",key,true);
  q.addEventListener("input",()=>{sel=0;draw();});
  list.addEventListener("click",e=>{const a=e.target.closest(".palit");if(!a)return;const x=res[+a.dataset.i];if(x.ext){setTimeout(close,0);return;}e.preventDefault();go(x);});
  m.addEventListener("click",e=>{if(e.target===m)close();});
  draw();setTimeout(()=>q.focus(),20);
}

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches(".chk")){

    if(el.checked){const box=$("t-"+id),card=$("task-"+id);if(card)card.classList.add("pop");floatXP(box,"+"+XP_TASK+" XP");

      afterGain(before);}
    return;}

  if(el.hasAttribute("data-ics")){const p=icsPrefs(),k=el.getAttribute("data-ics");
    if(k==="all")p.all=el.checked;else if(k==="dur"||k==="alarm")p[k]=+el.value;else if(el.value)p[k]=el.value;

});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="g-search"){gQuery=el.value;render(false);}if(el.id==="r-search"){rQuery=el.value;render(false);}
  if(el.hasAttribute&&el.hasAttribute("data-af")){const id=route().id;if(!AT[id])return;const k=el.getAttribute("data-af");S.tools[id]=Object.assign({},S.tools[id]);S.tools[id][k]=el.value.slice(0,1200);if(atArm){atArm=null;}commit();if(el.tagName==="SELECT")render(false);else atPaint();return;}
  if(el.hasAttribute&&el.hasAttribute("data-exw")&&exRun){exRun.w[el.getAttribute("data-exw")]=el.value.slice(0,4000);exSave();const wc=$("ex-wc");if(wc)wc.textContent=words(exRun.w.body)+" mots";return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("[data-mod-acc]")&&openMods){openMods[+d.dataset.modAcc]=d.open;}},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");
  const ni=e.target.closest(".ni");
  if(!ni)closeMenus();
  if(!b)return;
  if(b.classList.contains("skip")){e.preventDefault();focusMain();return;}
  // Menus déroulants
  if(b.matches(".nl[aria-haspopup],.avatar")){const p=b.closest(".ni"),was=p.classList.contains("open");closeMenus();if(!was){p.classList.add("open");b.setAttribute("aria-expanded","true");}$("nav").classList.remove("quiet");return;}
  if(b.closest(".dd")&&b.matches("a")){closeMenus();$("nav").classList.add("quiet");}
  if(b.id==="open-search"){openPalette();return;}
  if(b.id==="open-drawer"){openDrawer();return;}
  if(b.hasAttribute("data-theme-set")){applyTheme(b.getAttribute("data-theme-set"));document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x===b||x.getAttribute("data-theme-set")===b.getAttribute("data-theme-set"))));return;}
  const act=b.getAttribute("data-act");
  if(act==="search"){closeMenus();openPalette();return;}
  if(act==="reload"){location.reload();return;}
  if(act==="profile"){closeMenus();openProfile();return;}
  if(act==="account"){closeMenus();openAccount(cUser?"account":(cMeta.uid?"login":"signup"));return;}
  if(act==="login"){closeMenus();openAccount("login");return;}
  if(act==="nudge-x"){cMeta.nudge=Date.now();cmSave();render(false);return;}
  if(b.hasAttribute("data-adm")){const a=b.getAttribute("data-adm");if(a==="refresh"){adm.err=null;admLoad();if(!adm.L)render(false);return;}
    if(a==="csv"&&adm.L){saveFile("apprenants-sales-tech-academy-"+ymd(today())+".csv",new Blob([admCSV()],{type:"text/csv;charset=utf-8"})).then(ok=>{if(ok)toast(ic("dl")+" Liste des apprenants exportée");});}return;}
  if(act==="reset"){if(!resetArm){resetArm=true;clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArm=false;chrome(route().v);},5000);chrome(route().v);$("prof").classList.add("open");return;}
    resetArm=false;const name=S.name;S=norm({name,tools:S.tools});commit();closeMenus();render(true);toast("Progression réinitialisée");return;}
  if(b.hasAttribute("data-cal")){calM+=+b.getAttribute("data-cal");if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}render(false);return;}
  if(b.id==="start-save"){const v=$("start-date").value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){S.start=v;const sd=parse(v);calY=sd.getFullYear();calM=sd.getMonth();commit();render(false);toast("Début de la formation : "+h(fLong.format(sd)));}return;}
  if(b.hasAttribute("data-acc")){const o=b.getAttribute("data-acc")==="open";M.forEach((_,i)=>{openMods[i]=o;});render(false);return;}
  if(b.hasAttribute("data-gm")){gMod=+b.getAttribute("data-gm");fcI=0;fcFlip=false;fcOrder=null;if(gMode==="quiz")newQuiz();render(false);return;}
  if(b.hasAttribute("data-gmode")){gMode=b.getAttribute("data-gmode");fcI=0;fcFlip=false;if(gMode==="quiz")newQuiz();if(location.hash!=="#glossaire"&&route().v==="glossaire"){history.replaceState(null,"","#glossaire");lastKey="#glossaire";}render(false);return;}
  if(b.id==="fc"){fcFlip=!fcFlip;b.classList.toggle("flip",fcFlip);return;}
  if(b.id==="fc-again"){fcI++;fcFlip=false;render(false);return;}
  if(b.id==="fc-know"){const deck=deckList(),g=deck[fcI>=deck.length?0:fcI];if(g){const before=level(xp()),lit0=active(ymd(today()));S.known[g[0]]=ymd(today());bump();commit();fcFlip=false;render(false);floatXP($("fc-know"),"+"+XP_WORD+" XP");if(!lit0)toast(flame()+" Série prolongée : "+streakNow()+" jour"+(streakNow()>1?"s":""));afterGain(before);}return;}
  if(b.id==="fc-shuffle"){fcOrder=shuffle(gList().filter(g=>!S.known[g[0]]).map(g=>g[0]));fcI=0;fcFlip=false;render(false);return;}
  if(b.id==="fc-reset"){gList().forEach(g=>{delete S.known[g[0]];});commit();fcI=0;render(false);return;}
  if(b.hasAttribute("data-opt")){if(!qz||qz.picked!=null)return;qz.picked=+b.getAttribute("data-opt");if(qz.picked===qz.qs[qz.i].ans)qz.score++;render(false);return;}
  if(b.id==="qz-next"){qz.i++;qz.picked=null;if(qz.i>=qz.qs.length){const pct=Math.round(qz.score/qz.qs.length*100);if(pct>S.qbest){S.qbest=pct;commit();}bump();commit();if(pct>=80)confetti();}render(false);return;}
  if(b.id==="qz-new"){newQuiz();render(false);return;}
  if(b.hasAttribute("data-rl")){rLang=b.getAttribute("data-rl");render(false);return;}
  if(b.hasAttribute("data-tier")){cTier=+b.getAttribute("data-tier");render(false);return;}
  if(b.hasAttribute("data-cert")){const cid=b.getAttribute("data-cert"),v2=b.getAttribute("data-v"),was=S.certs[cid],before2=level(xp());if(v2==="todo")delete S.certs[cid];else S.certs[cid]=v2;if(v2==="done"&&was!=="done")bump();commit();render(false);if(v2==="done"&&was!=="done"){confetti();toast(ic("award")+" Certification obtenue : +"+XP_CERT+" XP");afterGain(before2);}return;}
  // Simulateur
  if(b.hasAttribute("data-sim-start")){simStart(b.getAttribute("data-sim-start"));toTop(document.querySelector(".simplay"),1);return;}
  if(b.hasAttribute("data-sim-pick")){simPick(+b.getAttribute("data-sim-pick"));return;}
  if(b.hasAttribute("data-coach")){const c=document.querySelector(".coach");if(c)window.scrollTo({top:c.getBoundingClientRect().top+window.scrollY-80,behavior:reduce?"auto":"smooth"});return;}
  // Atelier
  if(b.hasAttribute("data-at")){const id=route().id,a=b.getAttribute("data-at");if(!AT[id])return;
    if(a==="ex"){const en=S.tools[id]&&S.tools[id].lang==="en"&&AT[id].exEn;S.tools[id]=Object.assign({},en?AT[id].exEn:AT[id].ex);atArm=null;commit();render(false);toast(ic("spark")+" Exemple chargé : remplace-le par ton cas.");return;}
    if(a==="clear"){if(atArm!==id){atArm=id;clearTimeout(atArmT);atArmT=setTimeout(()=>{atArm=null;if(route().v==="atelier")render(false);},4000);render(false);return;}
      atArm=null;clearTimeout(atArmT);const keep={};if(S.tools[id]&&S.tools[id].lang)keep.lang=S.tools[id].lang;if(S.tools[id]&&S.tools[id].type)keep.type=S.tools[id].type;S.tools[id]=keep;commit();render(false);toast("Brouillon effacé");return;}
    if(a==="copy"){copyText(atBuild(id,atVals(id)).text);return;}
    return;}
  if(b.hasAttribute("data-afs")){const id=route().id;if(!AT[id])return;S.tools[id]=Object.assign({},S.tools[id],{cta:b.getAttribute("data-afs")});commit();render(false);return;}
  // Examen
  if(b.hasAttribute("data-ex")){const a=b.getAttribute("data-ex");
    if(a==="start"){if(!exOpen())return;exStart();if(location.hash!=="#examen"){location.hash="examen";}else render(true);window.scrollTo(0,0);return;}
    if(a==="close"){exLast=null;render(false);window.scrollTo(0,0);return;}
    if(!exRun)return;
    if(a==="next"){const ans=exRun.part===1?exRun.qa:exRun.sa,miss=ans.filter(x=>x==null).length;if(miss&&!exConfirm){exConfirm=true;render(false);return;}
      exRun.part++;exRun.i=0;exConfirm=false;exSave();render(false);window.scrollTo(0,0);return;}
    if(a==="back"){exRun.part=2;exRun.i=exRun.s.length-1;exConfirm=false;exSave();render(false);window.scrollTo(0,0);return;}
    if(a==="submit"){if(!exConfirm){exConfirm=true;render(false);return;}exConfirm=false;exFinish();return;}
    return;}
  if(b.hasAttribute("data-ex-a")&&exRun){const v=+b.getAttribute("data-ex-a"),i=exRun.i;if(exRun.part===1)exRun.qa[i]=v;else exRun.sa[i]=v;exConfirm=false;exSave();render(false);return;}
  if(b.hasAttribute("data-ex-go")&&exRun){const list=exRun.part===1?exRun.q:exRun.s;exRun.i=Math.max(0,Math.min(list.length-1,+b.getAttribute("data-ex-go")));exConfirm=false;exSave();render(false);toTop(document.querySelector(".exrun"));return;}
  // Certificat
  if(b.hasAttribute("data-cert-act")&&S.exam.pass){const a=b.getAttribute("data-cert-act"),P=S.exam.pass,slug=(P.nm||S.name||"certificat").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"certificat";
    if(a==="name"){const v=($("cert-nm").value||"").trim().slice(0,60);if(!v){$("cert-nm").focus();return;}P.nm=v;commit();paintCert();toast(ic("check")+" Nom mis à jour sur le certificat");return;}
    b.disabled=true;const done=ok=>{b.disabled=false;if(ok)toast(ic("dl")+" Certificat téléchargé");};
    drawCert(document.createElement("canvas"),certData()).then(cv=>{
      if(a==="pdf")return saveFile("Certificat-Sales-Tech-Academy-"+slug+".pdf",pdfFromCanvas(cv)).then(done);
      return new Promise(res=>cv.toBlob(res,"image/png")).then(bl=>saveFile("Certificat-Sales-Tech-Academy-"+slug+".png",bl)).then(done);
    }).catch(()=>{b.disabled=false;toast("Le téléchargement a échoué. Réessaie.");});return;}
  // Application et agenda
  if(b.hasAttribute("data-app")){const a=b.getAttribute("data-app");if(a==="install"){doInstall();return;}
    if(a==="ics"){const p=icsPrefs(),n=icsPlan(p).length;if(!n)return;saveFile("sales-tech-academy-seances.ics",new Blob([icsBuild(p)],{type:"text/calendar;charset=utf-8"})).then(ok=>{if(ok)toast(ic("cal")+" "+n+" séance"+(n>1?"s":"")+" exportée"+(n>1?"s":"")+" : ouvre le fichier pour l'ajouter à ton agenda");});return;}
    return;}
  if(b.hasAttribute("data-g")){const g=+b.getAttribute("data-g");gMod=g;gQuery="";if(g===0){gMode="quiz";newQuiz();}else gMode="list";location.hash="glossaire";return;}
  if(b.hasAttribute("data-tool")){closeMenus();openTool(b.getAttribute("data-tool"));return;}
});
