  <a class="solo" href="#certifications">Certifications</a>
  <details><summary>Ressources${ic("down").replace('class="ico"','class="ico chev"')}</summary><div>${Object.keys(RTYPES).map((k,i)=>`<a class="dd-l" href="#ressources${k==="all"?"":"-"+k}" style="--c:${mc(i)}"><span class="di">${ic("lib")}</span><span><b>${RTYPES[k][0]}</b><small>${countType(k)} ressources</small></span></a>`).join("")}</div></details>
  <details><summary>Mon profil${ic("down").replace('class="ico"','class="ico chev"')}</summary><div style="gap:10px"><div class="lvl"><b>Niveau ${lv.i+1} · ${h(lv.name)}</b>${bar(lv.next?(xp()-lv.from)/(lv.to-lv.from):1,null,"xpb")}</div><div class="seg" role="group" aria-label="Thème">${[["system","Système"],["light","Clair"],["dark","Sombre"]].map(t=>`<button type="button" data-theme-set="${t[0]}" aria-pressed="${getTheme()===t[0]}">${t[1]}</button>`).join("")}</div><button class="dd-l" type="button" data-act="profile"><span class="di">${ic("edit")}</span><span><b>Modifier mon profil</b></span></button></div></details>

function gList(){const q=gQuery.trim().toLowerCase();return G.filter(g=>{const mod=g[3]>=6?6:g[3];if(gMod&&mod!==gMod)return false;if(q&&(g[0]+" "+g[1]+" "+g[2]).toLowerCase().indexOf(q)<0)return false;return true;});}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newQuiz(){

}

function route(){
  const r=(location.hash||"").slice(1);let m;
  if((m=/^seance-(\d+)$/.exec(r)))return {v:"seance",n:+m[1]};
  if((m=/^module-(\d+)$/.exec(r)))return {v:"parcours",mod:+m[1]-1};
  if((m=/^fiche-(\d+)$/.exec(r)))return {v:"fiche",n:+m[1]};
  if((m=/^ressources-([a-z]+)$/.exec(r)))return {v:"ressources",type:m[1]};
  if(r==="quiz"||r==="cartes")return {v:"glossaire",mode:r==="quiz"?"quiz":"cards"};
  if(["parcours","certifications","glossaire","ressources","outils","fiches","accueil"].includes(r))return {v:r};
  return {v:"accueil"};
}
const view=$("view");let lastKey="";

const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function floatXP(el,txt){if(!el)return;const r=el.getBoundingClientRect(),f=document.createElement("div");f.className="xpf";f.textContent=txt;f.style.left=(r.left+r.width+8)+"px";f.style.top=(r.top-4)+"px";$("fx").appendChild(f);setTimeout(()=>f.remove(),1100);}

function confetti(){
  if(reduce)return;const cv=$("confetti");cv.hidden=false;const ctx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=["--m1","--m2","--m3","--m4","--m5","--m6","--m7","--flame-2"].map(v=>cs.getPropertyValue(v).trim()||"#888");
  const P=[];for(let i=0;i<150;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*12-4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});
  const t0=performance.now();
  (function f(t){const e=t-t0;ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-e/1900);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();});
    if(e<1900)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true;}})(t0);
}
function modal(html,cls,label){

  m.innerHTML=`<div class="mbox${cls?" "+cls:""}">${html}</div>`;$("fx").appendChild(m);
  function close(){m.remove();document.removeEventListener("keydown",esc);}

}

  const inp=m.querySelector("#pf-name");setTimeout(()=>inp.focus(),50);
  m.querySelector("#pf").addEventListener("submit",e=>{e.preventDefault();const n=inp.value.trim();if(!n){inp.focus();return;}
    S.name=n.slice(0,40);const sv=m.querySelector("#pf-start").value;if(/^\d{4}-\d{2}-\d{2}$/.test(sv)){S.start=sv;const sd=parse(sv);calY=sd.getFullYear();calM=sd.getMonth();}
    commit();close();if(isNew){location.hash="accueil";render(true);toast("Bienvenue "+h(S.name)+". Ta séance 1 t'attend.");}else{render(false);toast("Profil enregistré");}});
}

/* ---------- Palette de recherche ---------- */
let palIndex=null;
function buildIndex(){
  const it=[];
  SES.forEach(s=>it.push({g:"Séances",t:`Séance ${s.n} · ${s.t}`,s:M[s.m].t,href:"#seance-"+s.n,k:String(s.n),c:mc(s.m)}));
  M.forEach((m,i)=>it.push({g:"Modules",t:`Module ${i+1} · ${m.t}`,s:m.obj,href:"#module-"+(i+1),k:"M"+(i+1),c:mc(i)}));
  F.forEach((f,i)=>it.push({g:"Fiches",t:f.t,s:f.sub,href:"#fiche-"+(i+1),ic:"doc",c:mc(f.m)}));
  TOOLS_ORDER.forEach(id=>it.push({g:"Outils",t:TOOLS[id].t,s:TOOLS[id].d,tool:id,ic:TOOLS[id].i,c:"var(--m7)"}));
  C.forEach(c=>it.push({g:"Certifications",t:c[1],s:c[2]+" · "+c[4],href:"#certifications",ic:"award",c:"var(--m6)"}));
  G.forEach(g=>it.push({g:"Glossaire",t:g[0]+" · "+g[1],s:g[2],gloss:g[0],ic:"book",c:mc(Math.min(g[3],8)-1)}));
  Object.keys(R).forEach(id=>{const r=R[id];if(!isInt(r))it.push({g:"Ressources",t:r[0],s:r[1]+" · "+r[3]+" · "+r[4],href:r[2],ext:1,k:provMono(r[1]),c:provColor(r[1])});});
  return it;
}
const norm2=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function openPalette(){
  if(document.querySelector(".pal"))return;
  palIndex=palIndex||buildIndex();
  const m=document.createElement("div");m.className="modal pal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Recherche");
  m.innerHTML=`<div class="palbox"><div class="palin">${ic("search","color:var(--muted)")}<input id="pal-q" type="text" placeholder="Séance, fiche, terme, ressource…" autocomplete="off" aria-label="Rechercher dans la formation"><kbd>Échap</kbd></div><div class="pallist" id="pal-list" role="listbox"></div></div>`;
  $("fx").appendChild(m);
  const q=m.querySelector("#pal-q"),list=m.querySelector("#pal-list");let res=[],sel=0;
  function draw(){
    const v=norm2(q.value.trim());
    if(!v){const nx=nextSession();res=(nx?[palIndex.find(x=>x.href==="#seance-"+nx.n)]:[]).concat(palIndex.filter(x=>x.g==="Fiches"||x.g==="Outils"));}
    else{const terms=v.split(/\s+/);res=palIndex.filter(x=>{const hay=norm2(x.t+" "+x.s);return terms.every(t=>hay.includes(t));}).slice(0,40);}
    sel=Math.min(sel,Math.max(0,res.length-1));
    if(!res.length){list.innerHTML='<div class="palempty">Aucun résultat. Essaie un autre mot, en français ou en anglais.</div>';return;}
    let g="",html="";
    res.forEach((x,i)=>{if(x.g!==g){g=x.g;html+=`<div class="palgrp">${v?h(g):(i===0&&x.g==="Séances"?"Prochaine séance":h(g))}</div>`;}
      html+=`<a class="palit" role="option" data-i="${i}" aria-selected="${i===sel}" ${x.href?(x.ext?`href="${h(x.href)}" target="_blank" rel="noopener"`:`href="${x.href}"`):'href="#" '} style="--c:${x.c}"><span class="pk">${x.ic?ic(x.ic):h(x.k||"")}</span><span style="min-width:0"><b>${h(x.t)}</b><small>${h(x.s)}</small></span>${x.ext?ic("ext","width:15px;height:15px;color:var(--muted);margin-left:auto"):""}</a>`;});
    list.innerHTML=html;
    const s=list.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:"nearest"});
  }
  function go(x){if(!x)return;close();if(x.tool){openTool(x.tool);return;}if(x.gloss){gMode="list";gMod=0;gQuery=x.gloss;if(location.hash==="#glossaire")render(false);else location.hash="glossaire";return;}if(x.ext){return;}location.hash=x.href.slice(1);}
  function close(){m.remove();document.removeEventListener("keydown",key,true);}
  function key(e){
    if(e.key==="Escape"){e.preventDefault();close();}
    else if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(res.length-1,sel+1);draw();}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw();}
    else if(e.key==="Enter"){const x=res[sel];if(x&&x.ext){const a=list.querySelector(`[data-i="${sel}"]`);if(a)a.click();close();}else{e.preventDefault();go(x);}}
  }
  document.addEventListener("keydown",key,true);
  q.addEventListener("input",()=>{sel=0;draw();});
  list.addEventListener("click",e=>{const a=e.target.closest(".palit");if(!a)return;const x=res[+a.dataset.i];if(x.ext){setTimeout(close,0);return;}e.preventDefault();go(x);});
  m.addEventListener("click",e=>{if(e.target===m)close();});
  draw();setTimeout(()=>q.focus(),20);
}
function openTool(id){pendingTool=id;if(location.hash==="#outils")render(false);else location.hash="outils";}

/* ---------- Interactions ---------- */
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches(".chk")){
    const id=el.getAttribute("data-task"),n=+id.slice(1).split("-")[0],s=SES[n-1],wasDone=sDone(s),before=level(xp()),lit0=active(ymd(today()));
    if(el.checked){S.done[id]=ymd(today());bump();}else{delete S.done[id];}
    commit();render(false);
    if(el.checked){const box=$("t-"+id),card=$("task-"+id);if(card)card.classList.add("pop");floatXP(box,"+"+XP_TASK+" XP");
      if(!lit0)toast(flame()+" Série prolongée : "+streakNow()+" jour"+(streakNow()>1?"s":""));
      if(!wasDone&&sDone(s))setTimeout(()=>celebrate(s),250);
      afterGain(before);}
    return;}
  if(el.id==="r-type"){rType=el.value;render(false);return;}
});
document.addEventListener("input",e=>{if(e.target.id==="g-search"){gQuery=e.target.value;render(false);}if(e.target.id==="r-search"){rQuery=e.target.value;render(false);}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("[data-mod-acc]")&&openMods){openMods[+d.dataset.modAcc]=d.open;}},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");
  const ni=e.target.closest(".ni");
  if(!ni)closeMenus();
  if(!b)return;
  // Menus déroulants
  if(b.matches(".nl[aria-haspopup],.avatar")){const p=b.closest(".ni"),was=p.classList.contains("open");closeMenus();if(!was)p.classList.add("open");$("nav").classList.remove("quiet");return;}
  if(b.closest(".dd")&&b.matches("a")){closeMenus();$("nav").classList.add("quiet");}
  if(b.id==="open-search"){openPalette();return;}
  if(b.id==="open-drawer"){openDrawer();return;}
  if(b.hasAttribute("data-theme-set")){applyTheme(b.getAttribute("data-theme-set"));document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x===b||x.getAttribute("data-theme-set")===b.getAttribute("data-theme-set"))));return;}
  const act=b.getAttribute("data-act");
  if(act==="profile"){closeMenus();openProfile();return;}
  if(act==="reset"){if(!resetArm){resetArm=true;clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArm=false;chrome(route().v);},5000);chrome(route().v);$("prof").classList.add("open");return;}
    resetArm=false;const name=S.name;S=norm({name});commit();closeMenus();render(true);toast("Progression réinitialisée");return;}
  if(b.hasAttribute("data-cal")){calM+=+b.getAttribute("data-cal");if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}render(false);return;}
  if(b.id==="start-save"){const v=$("start-date").value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){S.start=v;const sd=parse(v);calY=sd.getFullYear();calM=sd.getMonth();commit();render(false);toast("Début de la formation : "+h(fLong.format(sd)));}return;}
  if(b.hasAttribute("data-acc")){const o=b.getAttribute("data-acc")==="open";M.forEach((_,i)=>{openMods[i]=o;});render(false);return;}
  if(b.hasAttribute("data-gm")){gMod=+b.getAttribute("data-gm");fcI=0;fcFlip=false;fcOrder=null;if(gMode==="quiz")newQuiz();render(false);return;}
  if(b.hasAttribute("data-gmode")){gMode=b.getAttribute("data-gmode");fcI=0;fcFlip=false;if(gMode==="quiz")newQuiz();if(location.hash!=="#glossaire"&&route().v==="glossaire"){history.replaceState(null,"","#glossaire");lastKey="#glossaire";}render(false);return;}
  if(b.id==="fc"){fcFlip=!fcFlip;b.classList.toggle("flip",fcFlip);return;}
  if(b.id==="fc-again"){fcI++;fcFlip=false;render(false);return;}
  if(b.id==="fc-know"){const deck=deckList(),g=deck[fcI>=deck.length?0:fcI];if(g){const before=level(xp()),lit0=active(ymd(today()));S.known[g[0]]=ymd(today());bump();commit();fcFlip=false;render(false);floatXP($("fc-know"),"+"+XP_WORD+" XP");if(!lit0)toast(flame()+" Série prolongée : "+streakNow()+" jour"+(streakNow()>1?"s":""));afterGain(before);}return;}
  if(b.id==="fc-shuffle"){fcOrder=shuffle(gList().filter(g=>!S.known[g[0]]).map(g=>g[0]));fcI=0;fcFlip=false;render(false);return;}
  if(b.id==="fc-reset"){gList().forEach(g=>{delete S.known[g[0]];});commit();fcI=0;render(false);return;}
  if(b.hasAttribute("data-opt")){if(!qz||qz.picked!=null)return;qz.picked=+b.getAttribute("data-opt");if(qz.picked===qz.qs[qz.i].ans)qz.score++;render(false);return;}
  if(b.id==="qz-next"){qz.i++;qz.picked=null;if(qz.i>=qz.qs.length){const pct=Math.round(qz.score/qz.qs.length*100);if(pct>S.qbest){S.qbest=pct;commit();}bump();commit();if(pct>=80)confetti();}render(false);return;}
  if(b.id==="qz-new"){newQuiz();render(false);return;}
  if(b.hasAttribute("data-rl")){rLang=b.getAttribute("data-rl");render(false);return;}
  if(b.hasAttribute("data-tier")){cTier=+b.getAttribute("data-tier");render(false);return;}
  if(b.hasAttribute("data-cert")){const cid=b.getAttribute("data-cert"),v2=b.getAttribute("data-v"),was=S.certs[cid],before2=level(xp());if(v2==="todo")delete S.certs[cid];else S.certs[cid]=v2;if(v2==="done"&&was!=="done")bump();commit();render(false);if(v2==="done"&&was!=="done"){confetti();toast(ic("award")+" Certification obtenue : +"+XP_CERT+" XP");afterGain(before2);}return;}
  if(b.hasAttribute("data-g")){const g=+b.getAttribute("data-g");gMod=g;gQuery="";if(g===0){gMode="quiz";newQuiz();}else gMode="list";location.hash="glossaire";return;}
  if(b.hasAttribute("data-tool")){closeMenus();openTool(b.getAttribute("data-tool"));return;}
});
$("nav").addEventListener("mouseleave",()=>$("nav").classList.remove("quiet"));
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return;}
  if(e.key==="Escape"){closeMenus();const d=$("drawer");if(d)d.remove();}
  const tg=e.target;
  if(e.key==="/"&&!(tg&&/INPUT|SELECT|TEXTAREA/.test(tg.tagName))&&!document.querySelector(".modal")){e.preventDefault();openPalette();return;}
  if(route().v!=="glossaire"||gMode!=="cards")return;if(tg&&/INPUT|SELECT|TEXTAREA/.test(tg.tagName))return;if(document.querySelector(".modal"))return;
  if(e.key===" "){if(tg&&tg.id==="fc")return;e.preventDefault();const fc=$("fc");if(fc){fcFlip=!fcFlip;fc.classList.toggle("flip",fcFlip);}}
  else if(e.key==="ArrowRight"){fcI++;fcFlip=false;render(false);}
});
window.addEventListener("hashchange",()=>{closeMenus();render(true);});

applyTheme(getTheme());
loadLocal();
if(S.start){const s0=parse(S.start);if(s0>today()){calY=s0.getFullYear();calM=s0.getMonth();}}
render(true);
initDb();
})();
</script>
